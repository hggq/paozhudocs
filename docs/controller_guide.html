    const cnFullContent = `
    <div style="text-align: center; margin-bottom: 1.8rem;">
        <h1 style="margin-top: 0.3rem;">🎮 Paozhu 控制器开发教程</h1>
        <p style="opacity: 0.8;">掌握 Paozhu 框架控制器开发的核心知识与实战技巧</p>
    </div>

    <h2 id="controller-basics">控制器基础</h2>
    <h3 id="what-is-controller">什么是控制器</h3>
    <p>控制器（Controller）是 Paozhu 框架中处理 HTTP 请求的核心组件。每个控制器函数接收客户端请求，执行业务逻辑，并返回响应结果。控制器通常位于 <code>controller/src/</code> 目录下。</p>

    <h3 id="create-basic-controller">创建基本控制器</h3>
    <p>一个标准的控制器包含头文件和源文件。首先创建头文件 <code>controller/src/testhello.h</code>：</p>
    <pre><code>#pragma once
#include "httppeer.h"

namespace http
{
    // 控制器函数声明
}
    </code></pre>
    <p>然后创建源文件 <code>controller/src/testhello.cpp</code>：</p>
    <pre><code>#include "httppeer.h"
#include "testhello.h"

namespace http
{
//@urlpath(null, hello)
std::string testhello(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << " Hello world! Paozhu framework ";
    return "";
}
}</code></pre>
    <div class="tip-box">
        💡 <strong>提示</strong>：控制器函数必须放在 <code>http</code> 命名空间内，框架会自动扫描该命名空间下的所有注解函数。
    </div>

    <h2 id="annotation-routing">注解路由</h2>
    <h3 id="urlpath-annotation">@urlpath 注解用法</h3>
    <p>Paozhu 使用 <code>//@urlpath</code> 注解来绑定 URL 路由。框架在编译时扫描所有注解，自动生成路由映射代码。</p>

    <h4 id="annotation-syntax">注解语法</h4>
    <pre><code>//@urlpath(前置拦截器, URL路径)
返回类型 函数名(std::shared_ptr<httppeer> peer)</code></pre>
    <ul>
        <li><strong>前置拦截器</strong>：可以为 <code>null</code>（无拦截器），也可以指定一个预处理函数（如 <code>islogin</code> 检查登录）</li>
        <li><strong>URL路径</strong>：绑定的 URL 路径，如 <code>hello</code> 对应 <code>/hello</code></li>
    </ul>

    <h4 id="annotation-example">完整示例</h4>
    <pre><code>//@urlpath(null,hello)
std::string testhello(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << " Hello world! Paozhu framework ";
    return "";
}</code></pre>
    <p>上述代码将 <code>/hello</code> 路径映射到 <code>testhello</code> 函数。当浏览器访问 <code>http://yourdomain/hello</code> 时，框架会自动调用该函数。</p>

    <h3 id="pre-filter-annotation">前置拦截器注解</h3>
    <p>前置拦截器可以在控制器函数执行前进行权限检查、日志记录等操作：</p>
    <pre><code>//@urlpath(islogin, admin)
std::string adminpage(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << "Admin panel";
    return "";
}</code></pre>
    <p>上述代码中，<code>islogin</code> 拦截器会在 <code>adminpage</code> 函数执行前被调用，用于验证用户是否已登录。</p>

    <h2 id="request-params">获取请求参数</h2>
    <h3 id="get-params">GET 参数</h3>
    <p>通过 <code>client.get</code> 对象获取 URL 查询字符串参数：</p>
    <pre><code>// 获取 GET 参数
std::string id = client.get["id"].to_string();
int page = client.get["page"].to_int();

// 带默认值获取
std::string keyword = client.get["keyword"].to_string("");
int limit = client.get["limit"].to_int(10);</code></pre>

    <h3 id="post-params">POST 参数</h3>
    <p>通过 <code>client.post</code> 对象获取表单 POST 参数。为防止 SQL 注入和 XSS 攻击，建议使用 <code>to_escape()</code> 方法进行安全转义：</p>
    <pre><code>// POST 参数（需处理安全转义）
std::string username = client.post["username"].to_escape();
std::string password = client.post["password"].to_string();

// 获取整数类型参数
int status = client.post["status"].to_int();

// 获取数组参数
auto tags = client.post["tags"].to_vector();</code></pre>

    <div class="warning-box">
        ⚠️ <strong>安全提示</strong>：处理用户输入时，务必使用 <code>to_escape()</code> 进行转义，特别是在将数据存入数据库或输出到 HTML 页面时。
    </div>

    <h3 id="file-upload">文件上传</h3>
    <p>通过 <code>client.files</code> 对象处理文件上传。上传的文件会先保存到服务端临时目录，需要调用 <code>std::filesystem::rename</code> 移动到目标目录：</p>
    <pre><code>// 获取上传文件信息（tempfile 为服务端临时文件路径）
std::string filename  = client.files["avatar"]["filename"].as_string();
std::string tempfile  = client.files["avatar"]["tempfile"].as_string();
unsigned int filesize = client.files["avatar"]["size"].to_int();

// 保存到站点 upload 目录
namespace fs = std::filesystem;
std::string sitepath = client.get_sitepath();
if (sitepath.back() != '/')
{
    sitepath.push_back('/');
}
sitepath.append("upload");
fs::create_directories(sitepath);
fs::rename(tempfile, sitepath + "/" + filename);
client << "File uploaded successfully: " << filename;</code></pre>

    <h2 id="session-management">Session 管理</h2>
    <h3 id="check-login">检查登录状态</h3>
    <p>使用 Session 验证用户登录状态是最常见的鉴权方式：</p>
    <pre><code>// 检查登录状态
if (client.session["userid"].to_int() == 0)
{
    // 未登录，渲染登录页（视图渲染必须调用 view 方法）
    client.view("login/login");
    return "";
}</code></pre>

    <h3 id="set-session">设置 Session</h3>
    <p>用户登录成功后，将用户信息存入 Session：</p>
    <pre><code>// 设置 Session
client.session["userid"] = users.getCompanyid();
client.session["username"] = users.getName();
client.save_session();</code></pre>

    <h3 id="destroy-session">销毁 Session</h3>
    <p>用户退出登录时，清除 Session 数据：</p>
    <pre><code>// 销毁 Session
client.clear_session();</code></pre>

    <h3 id="session-goto">跳转与 Session 配合</h3>
    <pre><code>// 跳转到其他页面
client.goto_url("/cms/list");

// 带延迟和消息的跳转
client.goto_url("/login", 3, "登录成功，正在跳转...");</code></pre>

    <h2 id="response-output">返回响应</h2>
    <h3 id="direct-output">直接输出文本</h3>
    <p>使用流操作符 <code>&lt;&lt;</code> 直接输出响应内容：</p>
    <pre><code>// 直接输出文本
client << "Hello World";

// 输出 HTML 内容
client << "<h1>Welcome</h1>";

// 输出 JSON 数据
client << "{\"status\":\"ok\",\"code\":200}";</code></pre>

    <h3 id="set-response-header">设置响应头</h3>
    <p>通过 <code>peer</code> 对象设置 HTTP 响应头：</p>
    <pre><code>// 设置响应类型
peer->type("application/json");
client.output = json_string;

// 设置自定义响应头
peer->set_header("X-Custom-Header", "Paozhu");

// 设置 HTTP 状态码
peer->status(404);
client << "Page Not Found";</code></pre>

    <h3 id="redirect-response">跳转响应</h3>
    <p>使用 <code>goto_url</code> 方法实现页面跳转：</p>
    <pre><code>// 立即跳转
client.goto_url("/dashboard");

// 带延迟跳转（3秒后跳转）
client.goto_url("/login", 3, "登录失败！");

// 带查询参数跳转
client.goto_url("/search?keyword=" + keyword);</code></pre>

    <h3 id="template-response">渲染模板</h3>
    <p>调用 <code>view</code> 方法渲染模板视图（注意：不能通过 <code>return</code> 返回模板路径，返回值会被当作下一个路由方法名查找）：</p>
    <pre><code>// 渲染模板视图
client.view("cms/list");
return "";

// 带数据渲染（数据需放入 client.val 供模板使用）
client.val["list"] = topics;
client.val["total"] = total;
client.view("cms/list");
return "";</code></pre>

    <h2 id="coroutine-controller">协程控制器</h2>
    <h3 id="async-basic">协程基础</h3>
    <p>Paozhu 支持 C++20 协程，使用 <code>asio::awaitable</code> 返回类型和 <code>co_await</code> 关键字实现异步操作。协程控制器特别适合处理数据库查询、外部 API 请求等 IO 密集型操作。</p>

    <h3 id="async-example">协程控制器示例</h3>
    <pre><code>//@urlpath(null,async_example)
asio::awaitable<std::string> async_example(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();

    // 协程方式执行异步操作
    auto result = co_await some_async_operation();

    client << "Result: " << result;
    co_return "";
}</code></pre>

    <h3 id="async-db-example">协程数据库操作</h3>
    <p>使用协程进行数据库查询，无需阻塞线程：</p>
    <pre><code>//@urlpath(null,async_users)
asio::awaitable<std::string> async_get_users(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();

    // 协程方式查询数据库
    auto users = co_await orm::cms::Sysuser().async_fetch();

    client.val["users"] = users;
    client.view("user/list");
    co_return "";
}</code></pre>

    <div class="tip-box">
        💡 <strong>协程优势</strong>：协程允许在等待 IO 操作时释放线程资源，从而大幅提升并发性能。推荐在涉及数据库、网络请求等场景使用协程控制器。
    </div>

    <h2 id="middleware-preprocessor">中间件预处理器</h2>
    <h3 id="pre-introduction">预处理器简介</h3>
    <p>预处理器（Pre Middleware）在控制器函数执行前运行，常用于：</p>
    <ul>
        <li>用户鉴权（检查登录状态、权限验证）</li>
        <li>日志记录（记录请求信息）</li>
        <li>CSRF 防护</li>
        <li>请求参数预处理</li>
        <li>性能监控</li>
    </ul>

    <h3 id="pre-create">创建预处理器</h3>
    <p>预处理器是返回 <code>std::string</code> 的普通控制器函数，同样通过 <code>@urlpath</code> 注解注册。框架调用预处理器时：返回 <code>"ok"</code> 表示继续执行目标控制器；返回空字符串表示直接结束；返回其他字符串（如 <code>"cms/login"</code>）则将其作为下一个路由方法名进行方法链跳转：</p>
    <pre><code>// 登录检查预处理器
//@urlpath(null,cms/islogin)
std::string islogin(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    if (client.session["userid"].to_int() == 0)
    {
        return "cms/login";  // 未登录，方法链跳转到登录页路由（cms/login 方法内渲染视图）
    }
    return "ok";  // 已登录，继续执行
}

// 日志记录预处理器（返回 "ok" 放行）
//@urlpath(null,logrequest)
std::string logrequest(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    std::string url = client.urlpath;  // 当前请求路径
    // 记录日志
    return "ok";
}</code></pre>

    <h3 id="pre-use">在注解中使用预处理器</h3>
    <p>在 <code>@urlpath</code> 注解的第一个参数中填入预处理器函数名，即可为路由绑定预处理逻辑：</p>
    <pre><code>// 使用 islogin 预处理器保护后台页面
//@urlpath(islogin, admin/panel)
std::string admin_panel(std::shared_ptr<httppeer> peer)
{
    // 只有预处理器返回 "ok" 时才会执行到此
    httppeer &client = peer->get_peer();
    client << "Admin Panel";
    return "";
}</code></pre>

    <h2 id="controller-basics">Controller Basics</h2>
    <h3 id="what-is-controller">What is a Controller</h3>
    <p>Controllers are the core components that handle HTTP requests in the Paozhu framework. Each controller function receives client requests, executes business logic, and returns responses. Controllers are typically located in the <code>controller/src/</code> directory.</p>

    <h3 id="create-basic-controller">Creating a Basic Controller</h3>
    <p>A standard controller consists of a header file and a source file. First, create the header file <code>controller/src/testhello.h</code>:</p>
    <pre><code>#pragma once
#include "httppeer.h"

namespace http
{
    // Controller function declarations
}
    </code></pre>
    <p>Then create the source file <code>controller/src/testhello.cpp</code>:</p>
    <pre><code>#include "httppeer.h"
#include "testhello.h"

namespace http
{
//@urlpath(null, hello)
std::string testhello(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << " Hello world! Paozhu framework ";
    return "";
}
}</code></pre>
    <div class="tip-box">
        💡 <strong>Tip</strong>: Controller functions must be placed in the <code>http</code> namespace. The framework automatically scans all annotated functions in this namespace.
    </div>

    <h2 id="annotation-routing">Annotation Routing</h2>
    <h3 id="urlpath-annotation">@urlpath Annotation Usage</h3>
    <p>Paozhu uses the <code>//@urlpath</code> annotation to bind URL routes. The framework scans all annotations at compile time and automatically generates routing mapping code.</p>

    <h4 id="annotation-syntax">Annotation Syntax</h4>
    <pre><code>//@urlpath(pre_filter, URL_path)
return_type function_name(std::shared_ptr<httppeer> peer)</code></pre>
    <ul>
        <li><strong>Pre-filter</strong>: Can be <code>null</code> (no filter), or specify a pre-processing function (e.g., <code>islogin</code> for login check)</li>
        <li><strong>URL Path</strong>: The URL path to bind, e.g., <code>hello</code> maps to <code>/hello</code></li>
    </ul>

    <h4 id="annotation-example">Complete Example</h4>
    <pre><code>//@urlpath(null,hello)
std::string testhello(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << " Hello world! Paozhu framework ";
    return "";
}</code></pre>
    <p>The code above maps the <code>/hello</code> path to the <code>testhello</code> function. When a browser visits <code>http://yourdomain/hello</code>, the framework automatically invokes this function.</p>

    <h3 id="pre-filter-annotation">Pre-filter Annotation</h3>
    <p>Pre-filters can perform permission checks, logging, and other operations before the controller function executes:</p>
    <pre><code>//@urlpath(islogin, admin)
std::string adminpage(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << "Admin panel";
    return "";
}</code></pre>
    <p>In the example above, the <code>islogin</code> filter is called before <code>adminpage</code> to verify the user is logged in.</p>

    <h2 id="request-params">Getting Request Parameters</h2>
    <h3 id="get-params">GET Parameters</h3>
    <p>Use the <code>client.get</code> object to access URL query string parameters:</p>
    <pre><code>// Get GET parameters
std::string id = client.get["id"].to_string();
int page = client.get["page"].to_int();

// Get with default values
std::string keyword = client.get["keyword"].to_string("");
int limit = client.get["limit"].to_int(10);</code></pre>

    <h3 id="post-params">POST Parameters</h3>
    <p>Use the <code>client.post</code> object to access form POST parameters. To prevent SQL injection and XSS attacks, use the <code>to_escape()</code> method for safe escaping:</p>
    <pre><code>// POST parameters (with safe escaping)
std::string username = client.post["username"].to_escape();
std::string password = client.post["password"].to_string();

// Get integer parameter
int status = client.post["status"].to_int();

// Get array parameter
auto tags = client.post["tags"].to_vector();</code></pre>

    <div class="warning-box">
        ⚠️ <strong>Security Warning</strong>: Always use <code>to_escape()</code> to sanitize user input, especially when storing data to a database or outputting to HTML pages.
    </div>

    <h3 id="file-upload">File Upload</h3>
    <p>Use the <code>client.files</code> object to handle file uploads. Uploaded files are first saved to a temporary directory on the server; use <code>std::filesystem::rename</code> to move them to the target directory:</p>
    <pre><code>// Get uploaded file info (tempfile is the server-side temporary path)

    <h3 id="async-basic">Coroutine Basics</h3>
    <p>Paozhu supports C++20 coroutines, using <code>asio::awaitable</code> return types and the <code>co_await</code> keyword for async operations. Coroutine controllers are especially suitable for IO-intensive operations like database queries and external API requests.</p>

    <h3 id="async-example">Coroutine Controller Example</h3>
    <pre><code>//@urlpath(null,async_example)
asio::awaitable<std::string> async_example(std::shared_ptr<httppeer> peer)
{

    auto result = co_await some_async_operation();

    <h2 id="middleware-preprocessor">Middleware Pre-processor</h2>
    <h3 id="pre-introduction">Introduction to Pre-processors</h3>
    <p>Pre-processors (Pre Middleware) run before the controller function and are commonly used for:</p>
    <ul>
        <li>Authentication (login check, permission verification)</li>
        <li>Logging (recording request information)</li>
        <li>CSRF protection</li>
        <li>Request parameter preprocessing</li>
        <li>Performance monitoring</li>
    </ul>

    <h3 id="pre-create">Creating a Pre-processor</h3>
    <p>A pre-processor is a regular controller function returning <code>std::string</code>, also registered via the <code>@urlpath</code> annotation. When the framework invokes a pre-processor: returning <code>"ok"</code> continues to the target controller; returning an empty string ends the chain directly; returning any other string (e.g. <code>"cms/login"</code>) is treated as the next route method name for a method-chain jump:</p>
    <pre><code>// Login check pre-processor
//@urlpath(null,cms/islogin)
std::string islogin(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    if (client.session["userid"].to_int() == 0)
    {
        return "cms/login";  // Not logged in: method-chain jump to the login route (the cms/login method renders the view)
    }
    return "ok";  // Logged in: continue
}

// Logging pre-processor (returns "ok" to pass through)
//@urlpath(null,logrequest)
std::string logrequest(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    std::string url = client.urlpath;  // current request path
    // Log the request
    return "ok";
}</code></pre>

    <h3 id="pre-use">Using Pre-processors in Annotations</h3>
    <p>Put the pre-processor function name in the first parameter of the <code>@urlpath</code> annotation to bind it to a route:</p>
    <pre><code>// Protect a backend page with the islogin pre-processor
//@urlpath(islogin, admin/panel)
std::string admin_panel(std::shared_ptr<httppeer> peer)
{
    // Only reached when the pre-processor returns "ok"
    httppeer &client = peer->get_peer();
    client << "Admin Panel";
    return "";
}</code></pre>

    document.getElementById('content-cn').innerHTML = cnFullContent;
    document.getElementById('content-en').innerHTML = enFullContent;

    function buildHierarchyNav(lang) {
        const container = document.getElementById('dynamic-nav');
        const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
        if (!contentDiv) {
            container.innerHTML = '<p>Content not found</p>';
            return;
        }
        const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
        if (headings.length === 0) {
            container.innerHTML = '<p style="padding: 1rem;">No sections</p>';
            return;
        }

        const root = { children: [] };
        let stack = [root];

        headings.forEach(heading => {
            let level = parseInt(heading.tagName[1]);
            const id = heading.id;
            let title = heading.innerText.trim();
            if (!title) title = heading.textContent.trim() || "Section";
            const node = { level, id, title, children: [] };
            while (stack.length > 0 && stack[stack.length-1].level >= level) {
                stack.pop();
            }
            const parent = stack[stack.length-1];
            parent.children.push(node);
            stack.push(node);
        });

        function renderTree(nodes) {
            if (!nodes.length) return '';
            let html = '<ul class="nav-tree no-bullet">';
            nodes.forEach(node => {
                const hasChildren = node.children.length > 0;
                const liClass = `level-${node.level}`;
                html += `<li class="${liClass}">`;
                html += `<div class="tree-item"><a href="#${node.id}" data-id="${node.id}" class="nav-link">${escapeHtml(node.title)}</a></div>`;
                if (hasChildren) {
                    html += renderTree(node.children);
                }
                html += `</li>`;
            });
            html += '</ul>';
            return html;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const navHtml = renderTree(root.children);
        container.innerHTML = navHtml || '<p>No navigation</p>';

        attachNavEvents(contentDiv);
    }

    function attachNavEvents(contentDiv) {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.removeEventListener('click', navClickHandler);
            link.addEventListener('click', navClickHandler);
        });
        function navClickHandler(e) {
            e.preventDefault();
            const targetId = this.getAttribute('data-id');
            const targetElem = contentDiv.querySelector(`#${targetId}`);
            if (targetElem) {
                targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.pushState(null, null, `#${targetId}`);
            }
            if (window.innerWidth <= 860) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            this.classList.add('active-link');
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    if (id) {
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.remove('active-link');
                            if (link.getAttribute('data-id') === id) {
                                link.classList.add('active-link');
                            }
                        });
                    }
                }
            });
        }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });

        const allHeadings = contentDiv.querySelectorAll('[id]');
        allHeadings.forEach(el => observer.observe(el));
    }

    let currentLang = 'cn';
    function switchLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
        if (lang === 'cn') {
            document.getElementById('content-cn').classList.add('active-lang');
        } else {
            document.getElementById('content-en').classList.add('active-lang');
        }
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        buildHierarchyNav(lang);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const lang = btn.getAttribute('data-lang');
            if (lang) switchLanguage(lang);
        });
    });

    const menuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-open');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
    }

    const topBtn = document.getElementById('scrollTopBtn');
    topBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // URL hash 检测语言切换
    const hashLang = window.location.hash;
    if (hashLang === '#english' || hashLang === '#en') {
        switchLanguage('en');
    } else if (hashLang === '#chinese' || hashLang === '#zh') {
        switchLanguage('cn');
    } else {
        buildHierarchyNav('cn');
    }
