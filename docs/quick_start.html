        <li><code>rate_limit_status</code> — Connection rate limiting switch (1 to enable), used with <code>rate_limit_new_wait_num</code> / <code>rate_limit_accept_wait_num</code> / <code>rate_limit_accept_time</code></li>
    </ul>

    <h3 id="create-controller">Create the Controller File</h3>
    <p>Create <code>testhello.cpp</code> in the <code>controller/src/</code> directory:</p>
    <pre><code>// controller/src/testhello.cpp
#include "httppeer.h"
#include "testhello.h"

namespace http
{
//@urlpath(null,hello)
std::string testhello(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    client << " Hello world! Paozhu c++ web framework ";
    return "";
}
}</code></pre>

    <h3 id="code-explain">Code Explanation</h3>
    <ul>
        <li><code>//@urlpath(null,hello)</code> — URL route annotation, binds the <code>/hello</code> path to this function</li>
        <li><code>httppeer</code> — HTTP peer object encapsulating client request information</li>
        <li><code>peer->get_peer()</code> — Get the underlying HTTP client reference</li>
        <li><code>client << "..."</code> — Use the stream operator to directly output response content</li>
        <li>Returns an empty string <code>""</code> to indicate the response was already sent via the stream operator</li>
    </ul>

    <h2 id="faq">FAQ</h2>
    <h3 id="port-conflict">Port Conflict</h3>
    <p><strong>Problem</strong>: Startup shows "Address already in use" or port occupied.</p>
    <p><strong>Solution</strong>: Change <code>httpport</code> and <code>httpsport</code> in <code>conf/server.conf</code> to different ports:</p>
    <pre><code># Check port usage
lsof -i :80

# Update configuration
# vim conf/server.conf
httpport = 8080
httpsport = 8443</code></pre>

    <h3 id="cert-issues">Certificate Issues</h3>
    <p><strong>Problem</strong>: HTTPS fails to start or shows certificate errors.</p>
    <p><strong>Solution</strong>: Verify that <code>certificate_chain_file</code> and <code>private_key_file</code> in the config point to valid certificate paths:</p>
    <pre><code># Check certificate files
ls -la /path/to/cert.pem
ls -la /path/to/key.pem

# Use self-signed certificate for development
openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes</code></pre>

    <h3 id="missing-deps">Missing Dependencies</h3>
    <p><strong>Problem</strong>: Compilation fails with "header file not found" or "library not found" errors.</p>
    <p><strong>Solution</strong>: Install the corresponding development packages:</p>
    <pre><code># macOS (via Homebrew)
brew install openssl zlib brotli asio

# Ubuntu/Debian
sudo apt install libssl-dev zlib1g-dev libbrotli-dev

# CentOS/RHEL
sudo dnf install openssl-devel zlib-devel brotli-devel</code></pre>

    document.getElementById('content-cn').innerHTML = cnFullContent;
    document.getElementById('content-en').innerHTML = enFullContent;

    function buildHierarchyNav(lang) {
        const container = document.getElementById('dynamic-nav');
        const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
        if (!contentDiv) {
            container.innerHTML = '<p>Content not found</p>';
            return;
        }
        const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
        if (headings.length === 0) {
            container.innerHTML = '<p style="padding: 1rem;">No sections</p>';
            return;
        }

        const root = { children: [] };
        let stack = [root];

        headings.forEach(heading => {
            let level = parseInt(heading.tagName[1]);
            const id = heading.id;
            let title = heading.innerText.trim();
            if (!title) title = heading.textContent.trim() || "Section";
            const node = { level, id, title, children: [] };
            while (stack.length > 0 && stack[stack.length-1].level >= level) {
                stack.pop();
            }
            const parent = stack[stack.length-1];
            parent.children.push(node);
            stack.push(node);
        });

        function renderTree(nodes) {
            if (!nodes.length) return '';
            let html = '<ul class="nav-tree no-bullet">';
            nodes.forEach(node => {
                const hasChildren = node.children.length > 0;
                const liClass = `level-${node.level}`;
                html += `<li class="${liClass}">`;
                html += `<div class="tree-item"><a href="#${node.id}" data-id="${node.id}" class="nav-link">${escapeHtml(node.title)}</a></div>`;
                if (hasChildren) {
                    html += renderTree(node.children);
                }
                html += `</li>`;
            });
            html += '</ul>';
            return html;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const navHtml = renderTree(root.children);
        container.innerHTML = navHtml || '<p>No navigation</p>';

        attachNavEvents(contentDiv);
    }

    function attachNavEvents(contentDiv) {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.removeEventListener('click', navClickHandler);
            link.addEventListener('click', navClickHandler);
        });
        function navClickHandler(e) {
            e.preventDefault();
            const targetId = this.getAttribute('data-id');
            const targetElem = contentDiv.querySelector(`#${targetId}`);
            if (targetElem) {
                targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.pushState(null, null, `#${targetId}`);
            }
            if (window.innerWidth <= 860) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            this.classList.add('active-link');
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    if (id) {
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.remove('active-link');
                            if (link.getAttribute('data-id') === id) {
                                link.classList.add('active-link');
                            }
                        });
                    }
                }
            });
        }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });

        const allHeadings = contentDiv.querySelectorAll('[id]');
        allHeadings.forEach(el => observer.observe(el));
    }

    let currentLang = 'cn';
    function switchLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
        if (lang === 'cn') {
            document.getElementById('content-cn').classList.add('active-lang');
        } else {
            document.getElementById('content-en').classList.add('active-lang');
        }
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        buildHierarchyNav(lang);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const lang = btn.getAttribute('data-lang');
            if (lang) switchLanguage(lang);
        });
    });

    const menuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-open');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
    }

    const topBtn = document.getElementById('scrollTopBtn');
    topBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // URL hash 检测语言切换
    const hashLang = window.location.hash;
    if (hashLang === '#english' || hashLang === '#en') {
        switchLanguage('en');
    } else if (hashLang === '#chinese' || hashLang === '#zh') {
        switchLanguage('cn');
    } else {
        buildHierarchyNav('cn');
    }
</script>
