<h2 id="core-components">核心组件分析</h2>

<h3 id="startup-lifecycle">1. 启动与生命周期</h3>

<h4>守护进程模式</h4>
<p>生产环境推荐使用守护进程模式运行：先初始化守护环境（fork 子进程后台运行），再获取单例 HTTP 服务器并运行，配置文件路径通过命令行参数传入。</p>
<pre><code>// startup/main_daemon.cpp — 守护进程模式启动
#include "httppeer.h"

int main(int argc, char* argv[])
{
    std::string config_path = "conf/server.conf";
    if (argc > 1) config_path = argv[1];

    // 初始化守护环境（fork 子进程，后台运行）
    http::init_daemon();

    // 获取单例 HTTP 服务器并运行
    http::get_server_app().run(config_path);
    return 0;
}</code></pre>

<h4>开发模式</h4>
<p>开发模式直接获取单例 HTTP 服务器并运行，便于调试和快速迭代。</p>
<pre><code>// startup/main_dev.cpp — 开发模式启动

{
    std::string config_path = "conf/server.conf";
    if (argc > 1) config_path = argv[1];

    // 获取单例 HTTP 服务器并运行
    http::get_server_app().run(config_path);
    return 0;
}</code></pre>

<div class="highlight-box">

</div>

<h3 id="route-discovery">2. 路由发现与控制器注册</h3>

<h4>自动发现（注解方式）</h4>
<p>通过宏注解 <code>//@urlpath</code> 将控制器函数映射到 URL，并在运行时自动填充到路由表中，类似 Java Spring Boot 的路由注册方式。</p>
<pre><code>// controller/src/techempower.cpp
#include "techempower.h"

//@urlpath(null, plaintext)
asio::awaitable<std::string> techempowerplaintext(
    std::shared_ptr<httppeer> peer)
{
    peer->type("text/plain; charset=UTF-8");
    peer->set_header("Date", get_gmttime());
    peer->output = "Hello, World!";
    co_return "";
}

// controller/src/admin/menu.cpp
//@urlpath(null,admin/dashboard)
std::string admin_dashboard(std::shared_ptr<httppeer> peer)
{
    httppeer& client = peer->get_peer();
    client.view("admin/dashboard");
    return "";
}</code></pre>

<p>框架在编译时自动扫描 <code>controller/src</code> 目录下的源文件，解析注解并生成路由映射代码到 <code>common/autocontrolmethod.hpp</code>。</p>

<h4>手动注册</h4>
<p>通过 <code>_inithttpmethodregto</code> 函数将 URL 与函数指针关联。每个路由用一个 <code>regmethold_t</code> 结构体描述：<code>pre</code> 为预处理器函数指针，<code>regfun</code> 为控制器函数指针，适用于需要灵活控制注册时机的场景。</p>
<pre><code>// common/reghttpmethod.hpp — 手动注册路由
namespace http {
    void _inithttpmethodregto(std::map<std::string, regmethold_t> &methodcallback)
    {
        struct regmethold_t temp;
        temp.pre = nullptr;
        temp.regfun = &http::testjson;
        methodcallback.emplace("testjson", temp);

        temp.pre = &http::admin_islogin;
        temp.regfun = &http::admin_welcome;
        methodcallback.emplace("admin/welcome", temp);
    }
}</code></pre>

<h4>协程控制器</h4>
<p>支持 <code>asio::awaitable</code> 形式的协程控制器，协程在 I/O 线程中运行，适合 I/O 密集型操作。</p>
<pre><code>// 协程控制器示例 — 异步获取数据
//@urlpath(null, coroutine_example)
asio::awaitable<std::string> coroutine_example(
    std::shared_ptr<httppeer> peer)
{
    httppeer& client = peer->get_peer();

    // 协程方式查询数据库
    auto world = orm::World();
    world.where("id", 1);
    co_await world.async_fetch();

    // 输出 JSON
    peer->output = world.to_json();
    peer->type("application/json; charset=UTF-8");
    co_return "";
}</code></pre>

<h4>控制器调用视图</h4>
<pre><code>// 在控制器中通过名称渲染视图
//@urlpath(admin_islogin,admin/addtopic)
std::string admin_addtopic(std::shared_ptr<httppeer> peer)
{
    httppeer& client = peer->get_peer();

    // 准备视图数据
    auto topicm = orm::cms::Topic();
    topicm.where("userid", client.session["userid"].to_int())
          .asc("parentid").fetch();

    client.val["list"].set_array();
    for (auto& record : topicm.record) {
        obj_val temp;
        temp["id"]       = record.topicid;
        temp["parentid"] = record.parentid;
        temp["value"]    = record.title;
        client.val["list"].push(temp);
    }

    // 通过名称渲染视图
    peer->view("admin/addtopic");
    return "";
}</code></pre>

<h3 id="websocket-factory">4. WebSocket/Socket 工厂</h3>

<h4>会话处理器与注册</h4>
<p>通过继承 <code>websockets_api</code> 基类编写会话处理类，并重写 <code>onopen/onmessage/onclose</code> 等回调（每个回调都有对应的 <code>async_</code> 协程版本）。最后在 <code>_initwebsocketmethodregto</code> 注册函数中，用 <code>methodcallback.emplace</code> 将路径映射到会话工厂。</p>
<pre><code>// common/websockets_method_reg.hpp — WebSocket 会话注册
#include "websockets_api.h"

// 自定义会话处理类，继承 websockets_api 基类
class my_websocket_handler : public websockets_api {
public:
    my_websocket_handler(unsigned int m, unsigned int g)
        : websockets_api(8, m, g, 0) {}

    // 协程方式处理客户端消息
    asio::awaitable<void> async_onmessage(websockets_data_list_t &&msg) override
    {
        std::string outhello;
        // 构造文本帧并回显给客户端
        ws_parse->make_ws_text(msg.value, outhello);
        co_await session_sock->async_send_writer(outhello);
        co_return;
    }
};

// 注册函数 — 将协议路径映射到会话工厂
void _initwebsocketmethodregto(WEBSOCKET_REG &methodcallback)
{
    methodcallback.emplace("wstest",
        [](unsigned int m, unsigned int g) -> std::shared_ptr<websockets_api>
        {
            return std::make_shared<my_websocket_handler>(m, g);
        });
}</code></pre>

<h3 id="request-flow">5. 请求处理流程</h3>

<p>一次完整的 HTTP 请求处理流程如下：</p>

<pre><code>// 完整请求处理流程示例
//@urlpath(islogin, api/getuser)
std::string api_getuser(std::shared_ptr<httppeer> peer)
{

    // ② 路由已匹配 → ③ islogin 中间件已通过

    // ④ 控制器执行 — 读取参数
    unsigned int userid = client.get["userid"].to_int();

    // ④ 业务逻辑 — 查询数据库
    auto user = orm::cms::Sysuser();
    user.where("userid", userid).fetch_one();

    // ⑤ 视图渲染 — 构造 JSON
    client.val["code"] = user.data.adminid > 0 ? 0 : 1;
    client.val["data"].set_object();
    client.val["data"]["id"]       = user.data.adminid;
    client.val["data"]["username"] = user.data.name;
    client.val["data"]["nickname"] = user.data.nickname;

    // ⑥ 响应返回
    client.out_json();
    return "";
}</code></pre>

<h2 id="io-model">I/O 模型</h2>

<h3>协程驱动的 I/O 与计算分离</h3>
<p>Paozhu 采用类似 Go 语言的调度思想，使用协程进行 I/O 等待，用户代码在独立线程池中执行，实现 I/O 与计算的完全分离。</p>

<div class="arch-diagram">
<pre style="color: var(--text-color);">
┌─────────────────────────────────────────────────────────────────┐
│                        请求处理模型                             │
├─────────────────────────────────────────────────────────────────┤
│                                                                 │
│  ┌──────────────────────┐         ┌──────────────────────┐     │
│  │   ASIO I/O 协程线程   │         │    业务线程池         │     │
│  │  (cothreadnum = 8)   │         │  (threadmax = 1024)  │     │
│  │                      │         │                      │     │
│  │  • accept 连接       │  I/O    │  • 同步控制器执行     │     │
│  │  • 解析 HTTP 协议    │  等待   │  • 文件 I/O 操作      │     │
│  │  • 协程控制器调度    │ ──────→ │  • CPU 密集型计算     │     │
│  │  • 异步数据库查询    │         │  • 同步 ORM 操作      │     │
│  │  • WebSocket 协程    │         │  • 视图渲染           │     │
│  │                      │         │                      │     │
│  └──────────────────────┘         └──────────────────────┘     │
│              │                            │                    │
│              │     协程控制器直接在 I/O 线程运行              │     │
│              └────────── 不经过业务线程池 ──────────┘          │
│                                                                 │
└─────────────────────────────────────────────────────────────────┘
</pre>
</div>

<h4>核心设计理念</h4>
<ul>
    <li><strong>I/O 等待不阻塞：</strong>协程在等待网络数据时主动让出 CPU，I/O 线程可以继续处理其他连接</li>
    <li><strong>计算与 I/O 分离：</strong>CPU 密集型任务放入业务线程池，避免阻塞 I/O 处理</li>
    <li><strong>协程传染性：</strong>在协程控制器中调用的函数也必须是协程版本（async_ 前缀），反之亦然</li>
    <li><strong>高并发吞吐：</strong>少量 I/O 协程线程可以处理大量并发连接，资源开销极低</li>
</ul>

<pre><code>// 协程控制器 — 在 I/O 线程运行，不经过业务线程池
//@urlpath(null, high_concurrency)
asio::awaitable<std::string> high_concurrency(
    std::shared_ptr<httppeer> peer)
{
    // 这些操作都在 I/O 线程中以协程方式执行
    auto db = orm::World();
    db.where("id", peer->get["id"].to_int());
    co_await db.async_fetch();  // 异步等待，不阻塞

    peer->output = db.to_json();
    co_return "";
}

// 同步控制器 — 提交到业务线程池执行
//@urlpath(null, cpu_intensive)
std::string cpu_intensive(std::shared_ptr<httppeer> peer)
{
    // CPU 密集型操作在业务线程池中执行
    httppeer& client = peer->get_peer();

    std::vector<int> data;
    for (int i = 0; i < 1000000; i++) {
        data.push_back(i * i);
    }

    client << "Computation done!";
    return "";
}</code></pre>

<div class="highlight-box">
    <strong>⚠️ 注意：</strong>不要在协程控制器（<code>asio::awaitable</code>）中使用 <code>std::this_thread::sleep_for()</code> 等阻塞操作，这会阻塞 I/O 线程，严重影响并发性能。
</div>

<h2 id="performance">性能优化</h2>

<h3>I/O 与计算分离</h3>
<p>框架将 I/O 操作与业务计算分离到不同的线程池中，协程控制器运行在 I/O 协程线程，同步控制器运行在业务线程池，确保高并发下的响应速度。</p>
<pre><code>// 配置文件示例 — 线程池参数

[default]

threadmax   = 1024    ; 最大业务线程数
threadmin   = 5       ; 最小业务线程数</code></pre>

<h3>高并发优化</h3>

<h4>HTTP/2 支持</h4>

[www.host.com]
http2_enable = 1   ; 每个域名可独立配置</code></pre>

<h4>WebSocket 支持</h4>
<p>内置 WebSocket 支持，支持实时双向通信，适用于聊天、推送等场景。</p>

<h4>ORM 连接池</h4>
<p>数据库连接池复用连接，避免频繁建立和断开连接的开销，支持主从分离和读写分离。</p>
<pre><code>// conf/orm.conf — 连接池配置（主库与从库在同一配置节内）

<h3 id="startup-lifecycle">1. Startup & Lifecycle</h3>

<h4>Daemon Mode</h4>
<p>Production environments recommend daemon mode: first initialize the daemon environment (fork a child process to run in the background), then obtain and run the singleton HTTP server. The config file path is passed as a command-line argument.</p>
<pre><code>// startup/main_daemon.cpp — Daemon mode startup
#include "httppeer.h"

int main(int argc, char* argv[])
{
    std::string config_path = "conf/server.conf";
    if (argc > 1) config_path = argv[1];

    // Initialize daemon environment (fork child process, run in background)
    http::init_daemon();

    // Get singleton HTTP server and run
    http::get_server_app().run(config_path);
    return 0;
}</code></pre>

<h4>Development Mode</h4>
<p>Development mode directly obtains and runs the singleton HTTP server, facilitating debugging and rapid iteration.</p>

<div class="flow-steps">

std::string api_getuser(std::shared_ptr<httppeer> peer)

    unsigned int userid = client.get["userid"].to_int();

    // ⑥ Response
    client.out_json();

<h2 id="io-model">I/O Model</h2>

<h3>Coroutine-Driven I/O and Computation Separation</h3>
<p>Paozhu adopts a Go-like scheduling philosophy, using coroutines for I/O waiting while user code executes in separate thread pools, achieving complete separation of I/O and computation.</p>

<div class="arch-diagram">
<pre style="color: var(--text-color);">
┌─────────────────────────────────────────────────────────────────┐
│                     Request Processing Model                     │
├─────────────────────────────────────────────────────────────────┤
│                                                                 │
│  ┌──────────────────────┐         ┌──────────────────────┐     │
│  │  ASIO I/O Coroutine  │         │   Business Thread    │     │
│  │  Thread Pool         │         │   Pool               │     │
│  │  (cothreadnum = 8)   │         │  (threadmax = 1024)  │     │
│  │                      │         │                      │     │
│  │  • Accept connections│  I/O    │  • Sync controllers  │     │
│  │  • Parse HTTP        │  Wait   │  • File I/O          │     │
│  │  • Coroutine dispatch│ ──────→ │  • CPU-intensive     │     │
│  │  • Async DB queries  │         │  • Sync ORM ops      │     │
│  │  • WebSocket coroutine│        │  • View rendering    │     │
│  │                      │         │                      │     │
│  └──────────────────────┘         └──────────────────────┘     │
│              │                            │                    │
│              │     Coroutine controllers run directly           │
│              └────────── in I/O threads ──────────────────┘    │
│                                                                 │
└─────────────────────────────────────────────────────────────────┘
</pre>
</div>

<h4>Core Design Principles</h4>
<ul>
    <li><strong>Non-blocking I/O:</strong> Coroutines voluntarily yield CPU while waiting for network data, allowing I/O threads to process other connections</li>
    <li><strong>Separation of Concerns:</strong> CPU-intensive tasks go to the business thread pool, avoiding I/O thread blocking</li>
    <li><strong>Coroutine Propagation:</strong> Functions called within coroutine controllers must also be coroutine versions (async_ prefix), and vice versa</li>
    <li><strong>High Concurrency:</strong> A small number of I/O coroutine threads can handle massive concurrent connections with minimal resource overhead</li>
</ul>

<pre><code>// Coroutine controller — runs in I/O thread, not business pool
//@urlpath(null, high_concurrency)
asio::awaitable<std::string> high_concurrency(
    std::shared_ptr<httppeer> peer)
{
    // These operations execute as coroutines in I/O threads
    auto db = orm::World();
    db.where("id", peer->get["id"].to_int());
    co_await db.async_fetch();  // Async wait, non-blocking

    peer->output = db.to_json();
    co_return "";
}

// Sync controller — dispatched to business thread pool
//@urlpath(null, cpu_intensive)
std::string cpu_intensive(std::shared_ptr<httppeer> peer)
{
    // CPU-intensive operations execute in business thread pool
    httppeer& client = peer->get_peer();

    std::vector<int> data;
    for (int i = 0; i < 1000000; i++) {
        data.push_back(i * i);
    }

    client << "Computation done!";
    return "";
}</code></pre>

<div class="highlight-box">
    <strong>⚠️ Warning:</strong> Do not use blocking calls like <code>std::this_thread::sleep_for()</code> in coroutine controllers (<code>asio::awaitable</code>), as this blocks the I/O thread and severely impacts concurrency.
</div>

<h2 id="performance">Performance Optimization</h2>

<h3>I/O and Computation Separation</h3>
<p>The framework separates I/O operations and business computation into different thread pools. Coroutine controllers run in I/O coroutine threads, while sync controllers run in the business thread pool, ensuring responsive performance under high concurrency.</p>
<pre><code>// Config example — thread pool parameters
// conf/server.conf
[default]
cothreadnum = 8        ; I/O coroutine threads (usually = CPU cores)
threadmax   = 1024    ; Max business threads
threadmin   = 5       ; Min business threads</code></pre>

<h3>High-Concurrency Optimization</h3>

<h4>HTTP/2 Support</h4>
<p>The framework natively supports HTTP/2, providing multiplexing, header compression, and other features that significantly improve page load speed.</p>
<pre><code>// conf/server.conf — Enable HTTP/2
[default]
http2_enable = 1

[www.host.com]
http2_enable = 1   ; Per-domain configuration</code></pre>

<h4>WebSocket Support</h4>
<p>Built-in WebSocket support for real-time bidirectional communication, suitable for chat, push notification, and other scenarios.</p>

<h4>ORM Connection Pool</h4>
<p>Database connection pool reuses connections to avoid frequent setup/teardown overhead, supporting master/slave and read/write separation.</p>
<pre><code>// conf/orm.conf — Connection pool config (primary and replica in the same section)
[default]
type    = main
host    = 127.0.0.1
port    = 3306
dbname  = hello_world
user    = benchmarkdbuser
maxpool = 5          ; Master pool size
dbtype  = mysql
charset = utf8mb4

type    = second
host    = 127.0.0.1
port    = 3306
dbname  = hello_world
user    = benchmarkdbuser
maxpool = 20          ; Slave pool size (reads > writes)
dbtype  = mysql
charset = utf8mb4</code></pre>

<h4>Static Resource Compression & Cache</h4>
<p>Built-in gzip and Brotli compression support. Compressed static resources can be cached to disk to avoid repeated compression overhead.</p>
<pre><code>// conf/server.conf — Static resource compression cache
[default]
static_file_compress_cache = 1   ; Enable compression cache
staticfile_cache_num       = 0   ; 0=disable, >=10 enable disk cache</code></pre>

<h3>Traffic Limiting</h3>

<h4>SMA-Based Two-Phase Rate Limiting</h4>
<p>The framework implements a built-in two-phase rate limiting mechanism based on Simple Moving Average (SMA), protecting the server without impacting normal traffic.</p>
<pre><code>// Rate limiting config example
// Internal framework implementation
// Phase 1: Hard limit based on connection count
// links_restart_process = n9998877ts1te5
//   Restart process during 1:00-5:00 AM when connections exceed 15000

// Phase 2: Soft limit based on time windows
// clean_cron = m5t600
//   Clean inactive connections older than 600s every 5 minutes

// reboot_cron = d180h5
//   Auto-restart every 180 days at 5:00 AM</code></pre>

        <li>Adjust <code>threadmax</code> based on business complexity, recommended 512-2048</li>
        <li>Enable <code>static_file_compress_cache=1</code> in production</li>
        <li>Use HTTP/2 to reduce connection overhead</li>
        <li>Set <code>maxpool</code> in database connection pool based on max concurrency</li>

function buildHierarchyNav(lang) {
    const container = document.getElementById('dynamic-nav');
    const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
    if (!contentDiv) {
        container.innerHTML = '<p>No content found</p>';
        return;
    }
    const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
    if (headings.length === 0) {
        container.innerHTML = '<p style="padding: 1rem;">No table of contents</p>';
        return;
    }

    const root = { children: [] };
    let stack = [root];

    headings.forEach(heading => {
        let level = parseInt(heading.tagName[1]);
        const id = heading.id;
        let title = heading.innerText.trim();
        if (!title) title = heading.textContent.trim() || "Section";
        const node = { level, id, title, children: [] };
        while (stack.length > 0 && stack[stack.length-1].level >= level) {
            stack.pop();
        }
        const parent = stack[stack.length-1];
        parent.children.push(node);
        stack.push(node);
    });

    function renderTree(nodes, levelClass = 'level-1') {
        if (!nodes.length) return '';
        let html = '<ul class="nav-tree no-bullet">';
        nodes.forEach(node => {
            const hasChildren = node.children.length > 0;
            const liClass = `level-${node.level}`;
            html += `<li class="${liClass}">`;
            html += `<div class="tree-item"><a href="#${node.id}" data-id="${node.id}" class="nav-link">${escapeHtml(node.title)}</a></div>`;
            if (hasChildren) {
                html += renderTree(node.children, `level-${node.level+1}`);
            }
            html += `</li>`;
        });
        html += '</ul>';
        return html;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    const navHtml = renderTree(root.children);
    container.innerHTML = navHtml || '<p>No navigation data</p>';

    attachNavEvents(contentDiv);
}

function attachNavEvents(contentDiv) {
    const links = document.querySelectorAll('.nav-link');
    links.forEach(link => {
        link.removeEventListener('click', navClickHandler);
        link.addEventListener('click', navClickHandler);
    });
    function navClickHandler(e) {
        e.preventDefault();
        const targetId = this.getAttribute('data-id');
        const targetElem = contentDiv.querySelector(`#${targetId}`);
        if (targetElem) {
            targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.pushState(null, null, `#${targetId}`);
        }
        if (window.innerWidth <= 860) {
            document.getElementById('sidebar').classList.remove('mobile-open');
        }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
        this.classList.add('active-link');
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.id;
                if (id) {
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active-link');
                        if (link.getAttribute('data-id') === id) {
                            link.classList.add('active-link');
                        }
                    });
                }
            }
        });
    }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });

    const allHeadings = contentDiv.querySelectorAll('[id]');
    allHeadings.forEach(el => observer.observe(el));
}

let currentLang = 'cn';
function switchLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
    if (lang === 'cn') {
        document.getElementById('content-cn').classList.add('active-lang');
    } else {
        document.getElementById('content-en').classList.add('active-lang');
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    buildHierarchyNav(lang);
    window.scrollTo(0, 0);
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const lang = btn.getAttribute('data-lang');
        if (lang) switchLanguage(lang);
    });
});

const menuBtn = document.getElementById('mobileMenuBtn');
const sidebar = document.getElementById('sidebar');
if (menuBtn) {
    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('mobile-open');
    });
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
            sidebar.classList.remove('mobile-open');
        }
    });
}

const topBtn = document.getElementById('scrollTopBtn');
topBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// URL hash 检测语言切换
const hashLang = window.location.hash;
if (hashLang === '#english' || hashLang === '#en') {
    switchLanguage('en');
} else if (hashLang === '#chinese' || hashLang === '#zh') {
    switchLanguage('cn');
} else {
    buildHierarchyNav('cn');
}
