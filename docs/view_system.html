    // 设置响应类型为 JSON
    peer->type("application/json");
    
    // 直接返回 JSON 字符串

    return "";

    result["pagination"]["current"] = current_page;
    result["pagination"]["total"] = total_page;
    
    client.output = result.to_json();
    return "";
}</code></pre>

        <p>Below is a complete HTML template example using <code>&lt;%c ... %&gt;</code> tags to embed C++ code, implementing variable output, conditionals, and loops (based on the real <code>view/techempower/fortunes.html</code>):</p>
        <pre><code>&lt;!-- view/login/login.html --&gt;
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;&lt;%c echo&lt;&lt;obj["title"].to_string(); %&gt;&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Welcome, &lt;%c echo&lt;&lt;obj["username"].to_string(); %&gt;&lt;/h1&gt;

    &lt;!-- Conditional check --&gt;
    &lt;%c if(obj["islogin"].to_bool()){ %&gt;
        &lt;p&gt;Logged in&lt;/p&gt;
    &lt;%c }else{ %&gt;
        &lt;p&gt;Please login&lt;/p&gt;
    &lt;%c } %&gt;

    &lt;!-- Loop through list --&gt;
    &lt;%c for(auto &amp;article : obj["articles"].as_array()){ %&gt;
        &lt;div class="article"&gt;
            &lt;h3&gt;&lt;%c echo&lt;&lt;article["title"].to_string(); %&gt;&lt;/h3&gt;
            &lt;p&gt;&lt;%c echo&lt;&lt;article["content"].to_string(); %&gt;&lt;/p&gt;
        &lt;/div&gt;
    &lt;%c } %&gt;

    &lt;!-- Pagination --&gt;
    &lt;div class="pagination"&gt;
        &lt;%c echo&lt;&lt;obj["pageinfo"]["current"].to_string(); %&gt; / &lt;%c echo&lt;&lt;obj["pageinfo"]["total"].to_string(); %&gt;
    &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>

        <h2 id="multi_module">Multi-Module Views</h2>
        <p>Paozhu supports multi-module view management, allowing you to maintain independent view directory structures for different business modules (admin, cms, superadmin, etc.).</p>
        <pre><code>view/
├── admin/
│   ├── login.html
│   ├── dashboard.html
│   └── user/
│       ├── list.html
│       └── edit.html
├── cms/
│   ├── index.html
│   └── article/
│       ├── list.html
│       └── detail.html
├── superadmin/
│   ├── system.html
│   └── config.html
└── login/
    └── login.html</code></pre>
        <p>Call templates for corresponding modules through different view paths in the controller:</p>
        <pre><code>// Call admin module view
peer->view("admin/dashboard");

// Call cms module view
peer->view("cms/article/list");

// Call superadmin module view
peer->view("superadmin/system");</code></pre>
        <div class="note-box">
            <strong>🏗️ Best Practice:</strong> Organize view files by business module, with each module having its own directory for easier maintenance and permission control.
        </div>

        <h2 id="json_response">JSON Response</h2>
        <p>When you don't need view rendering and want to return JSON data directly, skip calling <code>peer->view()</code> and set the output content directly:</p>
        <pre><code>//@urlpath(null, api_example)
std::string api_example(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    
    // Set response type to JSON
    peer->type("application/json");
    
    // Return JSON string directly
    client.output = R"({"code":0,"msg":"success","data":{}})";
    
    return "";
}</code></pre>

        <h3 id="json_obj">Building JSON with obj_val</h3>
        <p>Using the <code>obj_val</code> object to build JSON responses is recommended — it produces cleaner and safer code:</p>
        <pre><code>//@urlpath(null, api_users)
std::string api_users(std::shared_ptr<httppeer> peer)
{
    httppeer &client = peer->get_peer();
    peer->type("application/json");
    
    obj_val result;
    result.set_object();
    result["code"] = 0;
    result["msg"] = "success";
    
    // Data list
    result["data"].set_array();
    for (auto &user : users)
    {
        obj_val item;
        item.set_object();
        item["adminid"] = user.getAdminid();
        item["name"] = user.getName();
        item["email"] = user.getEmail();
        result["data"].push(item);
    }
    
    // Pagination
    result["pagination"].set_object();
    result["pagination"]["current"] = current_page;
    result["pagination"]["total"] = total_page;
    
    client.output = result.to_json();
    return "";
}</code></pre>

    document.getElementById('content-cn').innerHTML = cnFullContent;
    document.getElementById('content-en').innerHTML = enFullContent;

    function buildHierarchyNav(lang) {
        const container = document.getElementById('dynamic-nav');
        const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
        if (!contentDiv) {
            container.innerHTML = '<p>Content not found</p>';
            return;
        }
        const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
        if (headings.length === 0) {
            container.innerHTML = '<p style="padding: 1rem;">No navigation structure</p>';
            return;
        }

        const root = { children: [] };
        let stack = [root];
        
        headings.forEach(heading => {
            let level = parseInt(heading.tagName[1]);
            const id = heading.id;
            let title = heading.innerText.trim();
            if (!title) title = heading.textContent.trim() || "Section";
            const node = { level, id, title, children: [] };
            while (stack.length > 0 && stack[stack.length-1].level >= level) {
                stack.pop();
            }
            const parent = stack[stack.length-1];
            parent.children.push(node);
            stack.push(node);
        });

        function renderTree(nodes, levelClass = 'level-1') {
            if (!nodes.length) return '';
            let html = '<ul class="nav-tree no-bullet">';
            nodes.forEach(node => {
                const hasChildren = node.children.length > 0;
                const liClass = `level-${node.level}`;
                html += `<li class="${liClass}">`;
                html += `<div class="tree-item"><a href="#${node.id}" data-id="${node.id}" class="nav-link">${escapeHtml(node.title)}</a></div>`;
                if (hasChildren) {
                    html += renderTree(node.children, `level-${node.level+1}`);
                }
                html += `</li>`;
            });
            html += '</ul>';
            return html;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const navHtml = renderTree(root.children);
        container.innerHTML = navHtml || '<p>No navigation data</p>';
        
        attachNavEvents(contentDiv);
    }

    function attachNavEvents(contentDiv) {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.removeEventListener('click', navClickHandler);
            link.addEventListener('click', navClickHandler);
        });
        function navClickHandler(e) {
            e.preventDefault();
            const targetId = this.getAttribute('data-id');
            const targetElem = contentDiv.querySelector(`#${targetId}`);
            if (targetElem) {
                targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.pushState(null, null, `#${targetId}`);
            }
            if (window.innerWidth <= 860) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            this.classList.add('active-link');
        }
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    if (id) {
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.remove('active-link');
                            if (link.getAttribute('data-id') === id) {
                                link.classList.add('active-link');
                            }
                        });
                    }
                }
            });
        }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });
        
        const allHeadings = contentDiv.querySelectorAll('[id]');
        allHeadings.forEach(el => observer.observe(el));
    }

    let currentLang = 'cn';
    function switchLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
        if (lang === 'cn') {
            document.getElementById('content-cn').classList.add('active-lang');
        } else {
            document.getElementById('content-en').classList.add('active-lang');
        }
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        buildHierarchyNav(lang);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const lang = btn.getAttribute('data-lang');
            if (lang) switchLanguage(lang);
        });
    });
    
    const menuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-open');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
    }
    
    const topBtn = document.getElementById('scrollTopBtn');
    topBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    
    // URL hash 检测语言切换
    const hashLang = window.location.hash;
    if (hashLang === '#english' || hashLang === '#en') {
        switchLanguage('en');
    } else if (hashLang === '#chinese' || hashLang === '#zh') {
        switchLanguage('cn');
    } else {
        buildHierarchyNav('cn');
    }
</script>
