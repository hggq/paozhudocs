    const cnFullContent = `
    <div style="text-align: center; margin-bottom: 1.8rem;">
        <h1 style="margin-top: 0.3rem;">🗄️ Paozhu ORM 数据访问</h1>
        <p style="opacity: 0.8;">完整的 ORM 使用教程，涵盖模型定义、CRUD 操作、事务处理和连接池管理</p>
    </div>

    <h2 id="orm-overview">ORM 概述</h2>
    <p>Paozhu 内置的 ORM 系统，自研解析数据库协议，方便支持协程，支持 <code>MySQL</code> <code>PostgreSQL</code> 和 <code>SQLite</code> 数据库。通过配置文件 <code>conf/orm.conf</code> 进行多数据源管理。</p>

    <h3 id="built-in-client">内置数据库客户端</h3>
    <ul>
        <li>采用<strong>自研数据库连接协议</strong>，支持 MySQL PostgreSQL 和 SQLite，无需额外安装 MySQL Connector/C++ 或 libpq</li>
        <li>支持 <strong>MySQL 8.0.4 以上版本</strong>（支持 <code>caching_sha2_password</code> 认证插件）</li>
        <li>支持 <strong>MariaDB 12.1+</strong>（12.1 版本开始支持 <code>caching_sha2_password</code> 认证插件，与 MySQL 8.0 默认认证方式兼容）</li>
        <li>自研协议同时支持 <strong>C++20 协程（异步）</strong>和<strong>同步</strong>两种调用方式，可在同一项目中混用</li>
    </ul>

    <div class="tip-box">
        💡 提示：<strong>SQLite 模块需要显式开启</strong>。默认构建不包含 SQLite 支持，因为 SQLite 是嵌入式数据库，需要将 SQLite3 源码/库编译进项目（MySQL 和 PostgreSQL 使用自研协议，无需外部库）。编译时需添加 CMake 开关：
        <pre style="margin:0.5rem 0 0 0;"><code>cmake .. -DENABLE_SQLITE=ON</code></pre>
    </div>

    <h2 id="orm-architecture">ORM 架构介绍</h2>
    <p>Paozhu ORM 采用<strong>自研数据库协议</strong>（无需依赖 MySQL Connector/C++、libpq 等外部库），整体架构分为<strong>连接池层</strong>、<strong>模型层</strong>和<strong>中间连接层</strong>三层，并提供<strong>两个使用入口</strong>：</p>
    <ul>
        <li><strong>常用 CRUD 入口</strong> — 通过 CLI 生成在 <code>models</code> 目录下的模型对象（如 <code>orm::cms::Article()</code>）创建开始，适合日常增删改查。</li>
        <li><strong>纯 SQL 入口</strong> — 通过 <code>orm::db_conn</code> 直接执行原生 SQL 与事务，适合复杂查询。</li>
    </ul>

    <h3 id="arch-config">框架加载连接配置</h3>
    <p>框架启动时读取 <code>conf/orm.conf</code>，为每个数据源标签（tag）构建对应的连接池对象（<code>orm_conn_pool</code>）。每个标签维护 MySQL / PostgreSQL / SQLite 三套独立的<strong>读连接池</strong>与<strong>写连接池</strong>，连接对象分别由 <code>mysql_conn.h</code>、<code>pg_conn.h</code>、<code>sqlite_conn.h</code> 中自研的 <code>*_conn_base</code> 协议类实现。连接池通过 <code>orm_connect_mar.h</code> 中的连接监视器（<code>orm_connect_mar_t</code>）统一监控活跃连接、记录日志，并定期清理长期空闲连接。</p>

    <h3 id="arch-cli">CLI 生成 ORM 产物（models 目录）</h3>
    <p>运行 <code>./bin/paozhu_cli orm &lt;标签&gt;</code>，CLI 代码生成器（<code>modelfun.hpp</code>）会连接数据库扫描所有表结构，自动在 <code>orm/&lt;标签&gt;/include/</code> 目录下生成模型文件（<code>*_base.h</code> 数据定义 + <code>*_opsql.h</code> 操作类），例如 <code>orm/cms/include/article_base.h</code>。这些模型是数据表在 C++ 中的映射，即 <strong>CRUD 入口的对象来源</strong>。</p>

    <h3 id="arch-model">CRUD 入口：模型对象获取连接并查询</h3>
    <p>模型中间连接层（<code>mysqlorm.hpp</code>、<code>postgresqlorm.hpp</code>、<code>sqliteorm.hpp</code>）提供模板类 <code>mysql_orm&lt;M_MODEL, B_BASE&gt;</code>。业务代码创建模型对象（如 <code>orm::cms::Article()</code>）时，构造器从全局连接池注册表 <code>get_orm_conn_pool_obj()</code> 中按标签查找对应的 <code>orm_conn_pool</code>，随后通过链式方法（<code>where()</code>、<code>fetch()</code>、<code>save()</code>、<code>update()</code>、<code>remove()</code> 等）执行 CRUD 操作。</p>

    <h3 id="arch-native">纯 SQL 入口：原生 SQL 与事务</h3>
    <p><code>orm_query.h</code> 提供 <code>orm::db_conn</code> 封装（如 <code>orm::db_conn("cms")</code>），直接执行原生 SQL 和事务（<code>begin_commit()</code> / <code>commit()</code> / <code>rollback()</code>）。连接使用完毕后会归还连接池，实现连接复用。</p>

    <div class="tip-box">
        💡 小结：整体流程为 <strong>配置文件 → 框架加载 orm.conf 初始化连接池 → CLI 生成 orm models 目录 → 业务代码通过「CRUD 入口（模型对象）」或「纯 SQL 入口（orm::db_conn）」从连接池获取连接并查询/写入 → 归还连接</strong>。
    </div>

    <h3 id="orm-features">ORM 核心特性</h3>
    <ul>
        <li>多数据源配置与切换</li>
        <li>模型自动生成（<code>./bin/paozhu_cli orm <标签></code>）</li>
        <li>链式查询构造器（where、whereAnd、fetch、fetch_one）</li>
        <li>分页查询支持</li>
        <li>事务处理</li>
        <li>数据库连接池管理</li>
        <li>SSL 加密连接支持</li>
    </ul>

    <h2 id="config-datasource">配置数据源</h2>
    <p>在项目的 <code>conf/orm.conf</code> 文件中配置数据源。每个配置节（tag）下可以配置多个数据源：主库使用 <code>type = main</code>，从库使用 <code>type = second</code>。以下示例配置了 default 标签的主库与从库：</p>
    <pre><code>[default]
type = main
host = 127.0.0.1
port = 3306
dbname = cppcms
user = root
password = 12345678
pretable =
maxpool = 5
dbtype = mysql
charset = utf8mb4

type = second
host = 127.0.0.1
port = 3306
dbname = cppcms
user = root
password = 12345678
pretable =
maxpool = 5
dbtype = mysql
charset = utf8mb4</code></pre>

    <h3 id="config-params">配置参数说明</h3>
    <h4>基础参数</h4>
    <ul>
        <li><code>type</code> — 数据库类型，可选值：<code>main</code>（主库）、<code>second</code>（从库）</li>
        <li><code>host</code> — 数据库服务器地址</li>
        <li><code>port</code> — 数据库服务器端口</li>
        <li><code>dbname</code> — 数据库名称</li>
        <li><code>user</code> — 数据库用户名</li>
        <li><code>password</code> — 数据库密码</li>
        <li><code>pretable</code> — 表前缀，用于区分不同业务模块的表</li>
        <li><code>maxpool</code> — 连接池最大连接数</li>
        <li><code>dbtype</code> — 数据库类型标识（如 <code>mysql</code>、<code>postgresql</code>）</li>
        <li><code>charset</code> — 数据库字符集（如 <code>utf8</code>、<code>utf8mb4</code>）</li>
    </ul>

    <h4>SSL 加密参数</h4>
    <ul>
        <li><code>ssl</code> — 是否启用 SSL 连接，可选值：<code>ON</code>、<code>OFF</code>（默认）</li>
        <li><code>sslverify</code> — 是否校验证书链，可选值：<code>ON</code>、<code>OFF</code>；启用后会校验服务器证书是否由可信 CA 签发（配合系统 CA 证书或 <code>SSL_CERT_FILE</code> 环境变量）</li>
        <li><code>sslhost</code> — 证书域名（SNI + 域名校验）；为空时只验证证书链不校验域名；填值时会同时验证证书链和域名匹配</li>
    </ul>

    <div class="tip-box">
        💡 提示：<code>[default]</code> 为默认数据源，使用时无需指定数据源名称。其他数据源需要通过命名空间（如 <code>orm::cms::Tablename()</code>）来访问。SSL 相关参数默认注释掉，需要时去掉注释并修改对应值。
    </div>

    <h4>SSL 配置示例</h4>
    <pre><code>[cms]
type     = main
host     = 127.0.0.1
port     = 3306
dbname   = cppcms
user     = root
password = 12345678
pretable = 
maxpool  = 5
dbtype   = mysql
charset  = utf8mb4

# 启用 SSL 并校验证书链和域名
ssl      = ON
sslverify = ON
sslhost  = db.example.com</code></pre>

    <h2 id="create-model">创建模型</h2>
    <p>Paozhu 使用<strong>命令行工具自动生成</strong> ORM 模型文件，无需手动编写。通过 <code>paozhu_cli orm</code> 命令，根据 <code>conf/orm.conf</code> 中的配置标签自动生成所有表的模型。</p>

    <h3 id="cli-generate">使用 CLI 工具生成模型</h3>
    <p>首先确保 <code>orm.conf</code> 中已配置好数据库连接标签（如 <code>[cms]</code>、<code>[docs]</code>、<code>[ph]</code>），然后运行：</p>
    <pre><code># 为 cms 标签生成 ORM 模型（标签名对应 orm.conf 中的节）
./bin/paozhu_cli orm cms

# 为 default 标签生成 ORM 模型
./bin/paozhu_cli orm default

# 为 ph 标签（PostgreSQL）生成 ORM 模型
./bin/paozhu_cli orm ph</code></pre>

    <h3 id="generated-structure">生成的文件结构</h3>
    <p>运行命令后，框架会在 <code>orm/</code> 目录下自动生成以下结构：</p>
    <pre><code>orm/
├── orm.h                    # 统一入口头文件
├── cms/
│   └── include/
│       ├── article_base.h   # Article 模型基类（自动生成）
│       ├── article_opsql.h  # Article 操作类（自动生成）
│       ├── catalogue_base.h
│       └── ...
├── docs/
│   └── include/
│       └── ...
└── ph/
    └── include/
        └── ...</code></pre>

    <h3 id="use-model">使用生成的模型</h3>
    <p>在控制器中使用生成的模型，只需 <code>#include "orm.h"</code>，然后通过命名空间创建模型实例：</p>
    <pre><code>#include "orm.h"

// 使用 cms 标签的 Article 模型
auto articles = orm::cms::Article();

// 使用 cms 标签的 Sysuser 模型
auto users = orm::cms::Sysuser();

// 使用 default 标签的模型（基准测试表 World/Fortune）
auto worlds = orm::World();

// 使用 ph (PostgreSQL) 标签的模型
auto fortunes = orm::ph::Fortune();</code></pre>

    <div class="tip-box">
        💡 提示：模型文件由 CLI 工具自动生成，<strong>请勿手动修改</strong>。如果数据库表结构变更，只需重新运行 <code>./bin/paozhu_cli orm <标签></code> 命令即可更新模型。
    </div>

    <h3 id="model-features">模型特性</h3>
    <ul>
        <li>自动生成字段类型定义（<code>orm::cms::article_info::type::aid</code>）</li>
        <li>内置 <code>meta</code> 结构体存储字段数据</li>
        <li>支持 JSON 序列化（<code>to_json()</code>）</li>
        <li>支持树形结构（<code>meta_tree</code>、<code>meta_tree_ptr</code>）</li>
        <li>自动生成 SQL 语句（INSERT、UPDATE、DELETE）</li>
        <li>支持 <code>obj_val</code> 与 <code>meta</code> 互相转换</li>
    </ul>

    <h2 id="query-data">查询数据</h2>
    <p>Paozhu ORM 提供了丰富的查询方式，支持链式调用构造查询条件。</p>

    <h3 id="query-all">获取所有记录</h3>
    <pre><code>// 获取所有记录
auto articles = orm::cms::Article();
articles.where("isopen", 1).fetch();</code></pre>

articles.order("aid desc").fetch();

// 使用 desc() 降序

articles.limit(10).fetch();</code></pre>

    <h2 id="insert-data">插入数据</h2>
    <p>使用模型的 setter 方法设置字段值，然后调用 <code>save()</code> 方法插入新记录：</p>
    <pre><code>auto articles = orm::cms::Article();
articles.setIsopen(1);
articles.setCreatetime(get_date("%Y-%m-%d %X"));  // 格式化时间

articles.setAddip(client.client_ip);               // 客户端IP

articles.setContent("内容");

{
    int new_id = articles.getAid();  // 获取新记录ID
    client.goto_url("/cms/list", 3, "添加成功");
}</code></pre>

    <div class="tip-box">
        💡 提示：<code>save()</code> 方法用于新增记录。插入成功后，可以通过 <code>getAid()</code> 等 getter 方法获取自增 ID。
    </div>

    <h2 id="update-data">更新数据</h2>
    <p>先通过 setter 方法设置新值，再通过 <code>where()</code> 指定更新条件，最后调用 <code>update()</code> 方法并指定要更新的字段：</p>
    <pre><code>auto articles = orm::cms::Article();
articles.setTitle("修改后的标题");
articles.setContent("修改后的内容");

// 指定更新条件和要更新的字段

int effectnum = articles.update("title,content");

if (effectnum > 0)
{
    client.goto_url("/cms/list", 3, "更新成功");
}</code></pre>

    <div class="tip-box">
        💡 提示：<code>update()</code> 方法的参数指定要更新的字段名（用逗号分隔）。也可以不传参数 <code>update()</code>，此时会更新 <code>article.data</code> 中的<strong>所有</strong>字段，但必须先设置主键，否则会出错。建议配合 <code>where()</code> 条件使用。

    <h2 id="delete-data">删除数据</h2>

// 方式1：根据主键删除

// 方式2：配合 where 条件删除

int effectnum = articles.remove();

// 方式3：批量删除

    <div class="tip-box">
        💡 提示：<code>remove(id)</code> 方法根据主键直接删除记录。也可以使用 <code>remove()</code> 配合 <code>where()</code> 条件进行条件删除或批量删除。

    <h2 id="advanced-query">链式查询方法</h2>
    <p>Paozhu ORM 支持丰富的链式调用方法，方便构造复杂查询：</p>

    <h3 id="chain-like">LIKE 查询</h3>

    <h3 id="chain-operator">运算符查询</h3>

// 大于等于 &#62;=

    <h3 id="chain-limit">限制查询</h3>
    <pre><code>// 限制数量

// 偏移量 + 数量

{

    <h2 id="async-orm">异步 ORM 操作</h2>
    <p>在协程中使用异步 ORM 方法，所有异步方法均以 <code>async_</code> 开头：</p>

    <h3 id="async-methods">可用的异步 ORM 方法</h3>
    <table>
        <thead>
            <tr>
                <th>同步方法</th>
                <th>异步方法</th>
                <th>说明</th>
            </tr>
        </thead>
        <tbody>
            <tr><td><code>fetch()</code></td><td><code>async_fetch()</code></td><td>查询所有匹配记录</td></tr>
            <tr><td><code>fetch_one()</code></td><td><code>async_fetch_one()</code></td><td>查询单条记录</td></tr>
            <tr><td><code>fetch_append()</code></td><td><code>async_fetch_append()</code></td><td>查询并追加到现有结果集</td></tr>
            <tr><td><code>count()</code></td><td><code>async_count()</code></td><td>统计匹配记录数</td></tr>
            <tr><td><code>save()</code></td><td><code>async_save()</code></td><td>新增记录</td></tr>
            <tr><td><code>update()</code></td><td><code>async_update()</code></td><td>更新记录</td></tr>
            <tr><td><code>remove()</code></td><td><code>async_remove()</code></td><td>删除记录</td></tr>
        </tbody>
    </table>

    <h3 id="async-example">异步使用示例</h3>
    <pre><code>// 在协程中使用异步 ORM
#include "orm.h"

asio::awaitable&#60;void&#62; handle_request()
{
    auto model = orm::cms::Article();
    
    // 异步查询
    co_await model.async_fetch();
    co_await model.async_count();
    
    // 异步操作
    co_await model.async_save();
    co_await model.async_update();
    co_await model.async_remove();
}</code></pre>

    <h3 id="async-practical">实际应用示例（来自 techempower.cpp）</h3>

    <h4>异步查询单条记录</h4>
    <pre><code>// 随机查询一条 World 记录
//@urlpath(null,db)
asio::awaitable&#60;std::string&#62; techempowerdb(std::shared_ptr&#60;httppeer&#62; peer)
{
    peer-&#62;type("application/json; charset=UTF-8");
    auto myworld = orm::World();
    unsigned int rd_num = rand_range(1, 10000);
    myworld.where("id", rd_num);
    myworld.limit(1);
    co_await myworld.async_fetch_one();  // 异步查询单条
    
    peer-&#62;output = myworld.data_tojson();
    co_return "";
}</code></pre>

    <h4>异步批量查询（锁定连接复用）</h4>
    <pre><code>// 多次查询时锁定连接，避免重复连接开销
//@urlpath(null,queries)
asio::awaitable&#60;std::string&#62; techempowerqueries(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer-&#62;get["queries"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    myworld.record.reserve(get_num);
    myworld.lock_conn();  // 锁定连接
    
    for (unsigned int i = 0; i &#60; get_num; i++)
    {
        myworld.wheresql.clear();
        unsigned int rd_num = rand_range(1, 10000);
        myworld.where("id", rd_num);
        co_await myworld.async_fetch_append();  // 追加查询结果
    }
    
    myworld.unlock_conn();  // 解锁连接
    peer-&#62;output = myworld.to_json();
    co_return "";
}</code></pre>

    <h4>异步查询所有记录</h4>
    <pre><code>// 查询所有 Fortunes 并排序
//@urlpath(null,fortunes)
asio::awaitable&#60;std::string&#62; techempowerfortunes(std::shared_ptr&#60;httppeer&#62; peer)
{

        item["message"] = html_encode(record.message);

}</code></pre>

    <h4>异步更新操作</h4>
    <pre><code>// 批量更新随机数
//@urlpath(null,updates)
asio::awaitable&#60;std::string&#62; techempowerupdates(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer-&#62;get["queries"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    myworld.record.clear();
    myworld.record.reserve(get_num);
    myworld.lock_conn();  // 锁定连接
    
    for (unsigned int i = 0; i &#60; get_num; i++)
    {
        myworld.wheresql.clear();
        myworld.where("id", rand_range(1, 10000));
        co_await myworld.async_fetch_append();
        
        if (myworld.effect() &#62; 0)
        {
            unsigned int j = myworld.record.size() - 1;
            myworld.data.randomnumber = rand_range(1, 10000);
            myworld.record[j].randomnumber = myworld.data.randomnumber;
            co_await myworld.async_update("randomnumber");  // 异步更新指定字段
        }
    }
    
    myworld.unlock_conn();
    peer-&#62;output = myworld.to_json();
    co_return "";
}</code></pre>

    <h4>缓存 + 数据库联合查询</h4>
    <pre><code>// 先查缓存，缓存未命中则查数据库
//@urlpath(null,cached-db)
asio::awaitable&#60;std::string&#62; techempowercached_db(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer-&#62;get["count"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    std::string mycacheid = "my" + std::to_string(get_num);
    
    // 获取缓存连接
    pzcache&#60;std::vector&#60;orm::world_info::meta&#62;&#62; &temp_cache = 
        pzcache&#60;std::vector&#60;orm::world_info::meta&#62;&#62;::conn();
    
    myworld.record.reserve(get_num);
    
    if (temp_cache.check(mycacheid) &#62; -1)
    {
        // 命中缓存
        myworld.record = temp_cache.get(mycacheid);
    }
    else
    {
        // 缓存未命中，查询数据库
        std::vector&#60;unsigned int&#62; cacheid;
        for (unsigned int i = 0; i &#60; get_num; i++)
        {
            cacheid.push_back(rand_range(1, 10000));
        }
        
        std::string sqlstr = array_to_sql(cacheid);
        myworld.whereIn("id", sqlstr);
        co_await myworld.async_fetch();  // 异步 IN 查询
        
        // 写入缓存
        temp_cache.save(mycacheid, myworld.record, 360);
    }
    
    peer->output = myworld.to_json();
    co_return "";
}</code></pre>

    <div class="tip-box">
        💡 注意：同步控制器（返回 <code>std::string</code>）和协程控制器（返回 <code>asio::awaitable<std::string></code>）可以在同一项目中混用。框架会根据函数签名自动选择正确的执行路径。
    </div>

    <h2 id="native-sql">原生 SQL 查询</h2>
    <p>当需要执行复杂 SQL 或 ORM 不支持的查询时，使用 <code>orm::db_conn</code> 独立数据库连接：</p>
    <pre><code>#include "orm.h"
#include "orm_query.h"

// 1. 定义返回结果结构体
namespace orm::cust
{
    struct LocalusersqlStruct : orm::Base&#60;LocalusersqlStruct&#62;
    {
        unsigned int adminid;
        std::string name;
        std::string nickname;
        ORM_NAMES(adminid, name, nickname);
    };
}

// 2. 执行 SQL 查询
std::vector&#60;orm::cust::LocalusersqlStruct&#62; loaduser;
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");

std::string sqlstring = "SELECT adminid,name,nickname FROM sysuser where 1 limit 1";

    </div>

    <h2 id="transaction">事务处理</h2>
    <p>使用 <code>orm::db_conn</code> 独立数据库连接进行事务处理，确保多操作的原子性。</p>

    <h3 id="transaction-basic">基本事务操作</h3>
    <pre><code>#include "orm.h"
#include "orm_query.h"

// 1. 创建独立数据库连接（标签对应 orm.conf 配置）
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");

// 2. 开始事务
bool is_begin = ulink-&#62;begin_commit();

if (is_begin)
{
    try
    {
        // 3. 执行多个数据库操作
        ulink-&#62;edit_query("UPDATE sysuser SET nickname = '新名字' WHERE adminid = 10000");
        if (ulink-&#62;iserror)
        {
            ulink-&#62;rollback();  // 出错回滚
        }
        else
        {
            ulink-&#62;edit_query("INSERT INTO sysuser (adminid, name) VALUES (10001, 'test')");
            if (ulink-&#62;iserror)
            {
                ulink-&#62;rollback();  // 出错回滚
            }
            else
            {
                // 4. 提交事务
                ulink-&#62;commit();
            }
        }
    }
    catch (const std::exception& e)
    {
        ulink-&#62;rollback();
    }
}</code></pre>

    <h3 id="transaction-with-structure">带查询结果的事务</h3>
    <pre><code>// 定义返回结果结构体
namespace orm::cust
{
    struct UserStruct : orm::Base&#60;UserStruct&#62;
    {
        unsigned int adminid;
        std::string name;
        std::string nickname;
        ORM_NAMES(adminid, name, nickname);
    };
}

// 事务中查询并修改数据
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");
orm::cust::UserStruct commit_data;

if (ulink-&#62;begin_commit())
{
    try
    {
        // 更新操作
        ulink-&#62;edit_query("UPDATE sysuser SET nickname = '好听名字' WHERE adminid = 10000");
        if (!ulink-&#62;iserror)
        {
            // 插入操作
            ulink-&#62;edit_query("INSERT INTO sysuser (adminid, name) VALUES (NULL, 'userroot')");
            if (!ulink-&#62;iserror)
            {
                // 查询操作（使用同一连接）
                ulink-&#62;edit_query(
                    "SELECT adminid, name, nickname FROM sysuser WHERE adminid = 10000 LIMIT 1",
                    commit_data  // 结果存入结构体
                );
                if (!ulink-&#62;iserror)
                {
                    ulink-&#62;commit();  // 提交
                }
                else
                {
                    ulink-&#62;rollback();
                }
            }
            else
            {
                ulink-&#62;rollback();
            }
        }
        else
        {
            ulink-&#62;rollback();
        }
    }
    catch (const std::exception& e)
    {
        ulink-&#62;rollback();
    }
}

// 读取结果
if (commit_data.adminid != 0)
{
    std::cout &#60;&#60; "adminid: " &#60;&#60; commit_data.adminid 
              &#60;&#60; ", name: " &#60;&#60; commit_data.name &#60;&#60; std::endl;
}</code></pre>

    <h3 id="transaction-orm">使用 ORM 对象生成 SQL</h3>
    <pre><code>// 推荐使用 ORM 对象方式生成 SQL，然后配合事务提交
auto user_m = orm::cms::Sysuser();

// 获取 INSERT SQL
user_m.data.nickname = "新名字";
std::string insert_sql = user_m.commit_insert();

// 获取 UPDATE SQL
user_m.where("adminid", 10005);
std::string update_sql = user_m.commit_update("nickname");

// 获取 DELETE SQL
std::string delete_sql = user_m.commit_remove();

// 然后使用 db_conn 执行这些 SQL 并提交事务
auto ulink = std::make_unique<orm::db_conn>("cms");
if (ulink-&#62;begin_commit())
{
    ulink-&#62;edit_query(insert_sql);
    if (!ulink-&#62;iserror)
    {
        ulink-&#62;edit_query(update_sql);
        if (!ulink-&#62;iserror)
        {
            ulink-&#62;commit();
        }
        else
        {
            ulink-&#62;rollback();
        }
    }
    else
    {
        ulink-&#62;rollback();
    }
}</code></pre>

    <div class="tip-box">
        💡 提示：
        <ul>
            <li><code>begin_commit()</code> — 开始事务，返回 <code>bool</code> 表示是否成功</li>
            <li><code>edit_query(sql)</code> — 执行写操作（INSERT/UPDATE/DELETE），通过 <code>iserror</code> 判断是否出错</li>
            <li><code>edit_query(sql, result)</code> — 执行查询操作，结果存入结构体</li>
            <li><code>commit()</code> — 提交事务</li>
            <li><code>rollback()</code> — 回滚事务</li>
        </ul>
        事务处理对于需要保证数据一致性的场景非常重要，例如转账、订单处理等。如果事务中的任何操作失败，整个事务都会回滚。
    </div>

    <h2 id="connection-pool">数据库连接池</h2>
    <p>Paozhu ORM 使用连接池管理数据库连接，通过 <code>orm.conf</code> 中的 <code>maxpool</code> 参数来控制每个数据源的最大连接数：</p>
    <ul>
        <li><code>maxpool</code> 值越大，能支持的并发请求越多</li>
        <li>每个数据源独立管理自己的连接池</li>
        <li>空闲连接会自动回收，避免资源浪费</li>
        <li>连接池支持自动重连机制，网络异常后可自动恢复</li>
    </ul>
    <div class="tip-box">
        💡 建议：<code>maxpool</code> 值设置为业务线程数的 2-3 倍较为合适，具体数值需要根据实际业务场景和数据库承载能力进行调整。
    </div>

    <h2 id="db-migration">数据库迁移</h2>
    <p>数据库之间迁移（ MySQL &lt;=&gt; PostgreSQL &lt;=&gt; SQLite）</p>
    <p>使用 CLI 工具在数据库类型之间迁移数据（如 MySQL/CMS 迁移到 PostgreSQL），目标库的表会被自动创建：</p>
    <pre><code># 从 cms 迁移到 pg
./bin/paozhu_cli dbconver cms pg

# 强制迁移（覆盖已有表）
./bin/paozhu_cli dbconver cms pg force</code></pre>
    <div class="tip-box">
        💡 提示：迁移前请确认目标数据库已存在且连接配置正确（<code>orm.conf</code>）。不带 <code>force</code> 时，如果目标表已存在会跳过，避免误覆盖数据。
    </div>

    <h2 id="sql-export">SQL 导出</h2>
    <p>将数据库结构或数据导出为 SQL 文件，可用于备份、迁移或分发：</p>
    <pre><code># 导出表结构
./bin/paozhu_cli dbtable cms ./schema.sql
./bin/paozhu_cli dbtable cms ./pg.sql -target=pg      # 导出为 PG 语法

# 导出结构+数据
./bin/paozhu_cli dbexport cms ./dump.sql
./bin/paozhu_cli dbexport cms ./mysql.sql -target=mysql</code></pre>
    <div class="tip-box">
        💡 提示：默认导出当前数据源的 SQL 方言，也可通过 <code>-target=pg</code> / <code>-target=mysql</code> 指定目标数据库语法，方便在不同数据库之间迁移。
    </div>

    <h2 id="mariadb-caching-sha2">MariaDB 切换为 caching_sha2_password 认证插件</h2>
    <p>Paozhu ORM 内置的自研数据库客户端支持 <code>caching_sha2_password</code> 认证方式。MySQL 8.0 默认使用此插件，而 MariaDB（10.x ~ 11.x）默认使用 <code>mysql_native_password</code>，需要手动切换以获得与 MySQL 8.0 一致的认证行为。MariaDB 12.1+ 已原生支持 <code>caching_sha2_password</code>。</p>

    <h3 id="mariadb-caching-sha2-1">步骤一：安装认证插件</h3>
    <p>以 root 身份登录 MariaDB，安装 <code>auth_mysql_sha2</code> 插件（该插件实现了 <code>caching_sha2_password</code> 认证）：</p>
    <pre><code># 登录 MariaDB
mysql -uroot -p

# 安装 caching_sha2_password 插件
INSTALL SONAME 'auth_mysql_sha2';

# 确认插件已加载
SELECT plugin_name, plugin_status FROM mysql.plugin WHERE plugin_name LIKE '%sha2%';</code></pre>
    <div class="tip-box">
        💡 提示：如果 <code>INSTALL SONAME 'auth_mysql_sha2'</code> 报错找不到插件文件，请确认你的 MariaDB 版本 ≥ 10.11，且 <code>plugin_dir</code> 路径下存在 <code>auth_mysql_sha2.so</code>（Linux）或 <code>auth_mysql_sha2.dylib</code>（macOS）。可以通过 <code>SHOW VARIABLES LIKE 'plugin_dir';</code> 查看插件目录。
    </div>

    <h3 id="mariadb-caching-sha2-2">步骤二：切换用户认证插件</h3>
    <p>将目标用户（如 root）的认证插件切换为 <code>caching_sha2_password</code>，并设置新的密码哈希：</p>
    <pre><code>-- 方式1：直接修改 mysql.user 表（适用于已有用户）
UPDATE mysql.user
SET plugin='caching_sha2_password',
    authentication_string=PASSWORD('12345678')
WHERE user='root' AND host='localhost';

-- 方式2：使用 ALTER USER 语法（MariaDB 10.11+ 推荐）
ALTER USER 'root'@'localhost' IDENTIFIED BY '12345678';
ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '12345678';

-- 刷新权限使配置生效
FLUSH PRIVILEGES;</code></pre>

    <h3 id="mariadb-caching-sha2-3">步骤三：配置默认认证插件（可选）</h3>
    <p>如果希望新建用户时默认使用 <code>caching_sha2_password</code>，可以在 MariaDB 配置文件（<code>my.cnf</code> 或 <code>my.ini</code>）的 <code>[mysqld]</code> 节添加：</p>
    <pre><code>[mysqld]
# 设置默认认证插件
default_authentication_plugin = caching_sha2_password

# 确保插件在启动时加载
plugin_load_add = auth_mysql_sha2</code></pre>
    <p>修改后重启 MariaDB 服务：</p>
    <pre><code># macOS (Homebrew)
brew services restart mariadb

# Linux (systemd)
sudo systemctl restart mariadb

# Docker
docker restart &#60;container_name&#62;</code></pre>

    <h3 id="mariadb-caching-sha2-4">步骤四：生成 RSA 密钥（非 SSL 连接必需）</h3>
    <p>使用 <code>caching_sha2_password</code> 认证时，如果客户端与服务端之间<strong>未使用 SSL 加密连接</strong>，密码需要通过 RSA 密钥对进行加密传输。MariaDB 服务器在启动时会从数据目录读取 <code>private_key.pem</code>（私钥）和 <code>public_key.pem</code>（公钥）来执行 RSA 加密交换，因此必须预先生成。</p>
    <div class="tip-box">
        💡 数据目录说明：在 macOS 上通过 Homebrew 安装时，数据目录通常为 <code>/usr/local/var/mysql</code>（或 Apple Silicon 上的 <code>/opt/homebrew/var/mysql</code>）。这只是目录名恰好叫 <code>mysql</code> 而已，并非另一个 MySQL 实例。所有数据库文件、错误日志以及 <code>mysql.user</code> 表都存放在这里，因此把 RSA 密钥生成在此处是完全正确的。
    </div>
    <p>进入数据目录并按顺序执行以下命令：</p>
    <pre><code># 1. 进入数据目录
cd /usr/local/var/mysql

# 2. 生成 RSA 私钥和公钥（使用 OpenSSL）
openssl genrsa -out private_key.pem 2048
openssl rsa -in private_key.pem -pubout -out public_key.pem

# 3. 调整文件权限（确保 MariaDB 进程可读）
chmod 644 private_key.pem public_key.pem
chown $(whoami):admin private_key.pem public_key.pem   # 如果您的用户组不是 admin，可忽略</code></pre>
    <p>生成完成后，重启 MariaDB 服务，使其在启动时自动加载这两份密钥文件：</p>
    <pre><code># macOS (Homebrew)
brew services restart mariadb</code></pre>
    <div class="tip-box">
        💡 提示：如果客户端使用 SSL 连接（在 <code>orm.conf</code> 中配置 <code>ssl = ON</code>），则无需 RSA 密钥交换，此步骤可以跳过。RSA 仅用于非 SSL 连接下的密码加密传输。
    </div>

    <h3 id="mariadb-caching-sha2-5">验证切换结果</h3>
    <pre><code>-- 查看当前用户的认证插件
SELECT user, host, plugin FROM mysql.user WHERE user='root';

-- 测试新连接（使用新密码）
mysql -uroot -p12345678 -e "SELECT VERSION();"</code></pre>
    <p>如果 <code>plugin</code> 列显示 <code>caching_sha2_password</code> 且能正常登录，说明切换成功。</p>

    <div class="warn-box">
        ⚠️ 注意：切换认证插件后，旧的使用 <code>mysql_native_password</code> 方式连接的客户端（如旧版 mysql 命令行工具、部分 ORM 框架）将无法连接。请确保所有客户端都支持 <code>caching_sha2_password</code> 认证协议后再进行切换。Paozhu ORM 从一开始就支持此插件，可以放心使用。
    </div>

    <h3 id="mariadb-caching-sha2-6">回滚方式</h3>
    <p>如果切换后遇到问题，可以按以下步骤回滚到 <code>mysql_native_password</code>：</p>
    <pre><code># 以 root 登录（如果还能登录）
mysql -uroot -p

# 回滚认证插件
ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '12345678';
FLUSH PRIVILEGES;

# 如果无法登录，可临时跳过权限表启动 MariaDB：
# mysqld --skip-grant-tables
# 然后执行 UPDATE mysql.user SET plugin='mysql_native_password' WHERE user='root';
# FLUSH PRIVILEGES; 再正常重启</code></pre>


    <h2 id="mysql-auth-ssl">MySQL/MariaDB 认证与 SSL 配置指南</h2>
    <p>Paozhu ORM 内置客户端完整支持 <code>caching_sha2_password</code> 认证（MySQL 8.0+ 默认、MariaDB 12.1+ 原生）。本章覆盖三档认证模式、RSA 公钥管理、SSL=ON 完整流程与安全加固。</p>

    <h3 id="mysql-auth-ssl-1">三档认证模式速查</h3>
    <table>
        <thead><tr><th>档位</th><th>配置</th><th>防窃听</th><th>防中间人换公钥 (CVE-2015-3152)</th><th>防 SSL 降级</th><th>推荐场景</th></tr></thead>
        <tbody>
            <tr><td><strong>A 兼容（默认）</strong></td><td>什么都不配</td><td>❌ 明文</td><td>❌</td><td>❌</td><td>本地开发、同机连接 Unix socket</td></tr>
            <tr><td><strong>B 公钥钉住</strong></td><td><code>server_public_key=/path/to/public_key.pem</code></td><td>❌ 明文</td><td>✅ 认证阶段拦下，密码不发出</td><td>❌</td><td>可信内网但上不了 TLS；需要防同网段 ARP 欺骗</td></tr>
            <tr><td><strong>C TLS（推荐）</strong></td><td><code>ssl=ON</code> + <code>sslverify=ON</code> + <code>sslhost=域名</code></td><td>✅ TLS 加密</td><td>✅ 不用公钥</td><td>✅ A3 守卫强制加密</td><td>生产、跨网段</td></tr>
        </tbody>
    </table>
    <div class="tip-box">
        💡 <strong>重要提示</strong>：B 档只保护认证阶段不被骗密码，SQL 与结果集仍是明文。C 档才是完整安全方案。<br>
        MariaDB 12.3+ 每次认证都走 Auth More Data 公钥请求（不像 MySQL 有 fast auth 缓存命中），TLS OFF + 无钉住 = 每次认证都暴露。
    </div>

    <h3 id="mysql-auth-ssl-2">找到服务器 RSA 公钥</h3>
    <p><code>caching_sha2_password</code> 使用 RSA 密钥对加密密码。MySQL 8+ 初始化 datadir 时会<strong>自动生成</strong>密钥对，一般无需手动生成：</p>
    <pre><code># MySQL (Homebrew)
/usr/local/mysql/data/public_key.pem

# MariaDB (Homebrew) —— 目录名碰巧叫 mysql，是 MariaDB 的数据目录
/usr/local/var/mysql/public_key.pem

# Linux
/var/lib/mysql/public_key.pem

# 验证指纹（与客户端钉住的 PEM 必须一致）
openssl pkey -pubin -in /usr/local/var/mysql/public_key.pem -outform DER | openssl dgst -sha256</code></pre>

    <h3 id="mysql-auth-ssl-3">密钥不存在？手动生成</h3>
    <p>以 MariaDB 为例生成 RSA 密钥对（MySQL 8 一般已自动生成）：</p>
    <pre><code># 1. 进入数据目录
cd /usr/local/var/mysql          # MariaDB (Homebrew)
# cd /usr/local/mysql/data      # MySQL (Homebrew)

# 2. 生成 RSA 私钥和公钥（2048 位足够，OAEP 载荷 ≤ 32 字节）
openssl genrsa -out private_key.pem 2048
openssl rsa    -in private_key.pem -pubout -out public_key.pem

# 3. 权限：私钥仅数据库进程可读，公钥公开可读
chmod 600 private_key.pem        # 🔴 永远不要 644！私钥泄露 = 离线解密密码
chmod 644 public_key.pem
chown $(whoami):admin private_key.pem public_key.pem   # Homebrew: hzq:admin

# 4. 自检：公钥必须能由私钥推出来
openssl rsa -in private_key.pem -pubout | diff - public_key.pem && echo "keypair OK"

# 5. 重启数据库 —— 密钥只在启动时读一次，生成后不重启等于没换
brew services restart mariadb   # or: mysql.server restart</code></pre>

    <div class="tip-box">
        ⚠️ <strong>安全红线</strong>：<code>private_key.pem</code> 权限必须是 <code>0600</code> + 属主为数据库进程用户。<br>
        <code>chmod 644 private_key.pem</code>（常见教程笔误）会让同机任意本地用户：① 离线解密抓到的认证包；② 冒充服务器骗过 B 档钉住。B 档直接归零。<br>
        <strong>私钥永远不要拷到客户端</strong>，B 档拷的只有 <code>public_key.pem</code>。
    </div>

    <h3 id="mysql-auth-ssl-4">配置方法</h3>
    <p>打开 <code>conf/orm.conf</code>，找到对应的 dbtag [docs] 配置块，添加：</p>
    <pre><code>[docs]
type     = main
host     = 127.0.0.1
port     = 3306
dbname   = hello_world
user     = root
password = 12345678
pretable = web_
maxpool  = 5
dbtype   = mysql
charset  = utf8mb4

; ===== B 档：公钥钉住 =====
; server_public_key=/www/paozhu/conf/public_key.pem

; ===== C 档：TLS（推荐） =====
; ssl=ON
; sslverify=ON
; sslhost=db.example.com     ; 证书 CN/SAN 中的域名，留空则用 host 兜底</code></pre>


    <h3 id="mysql-auth-ssl-5">SSL ON 认证完整流程</h3>
    <pre><code>① TCP 连接握手
   host:3306 → sock_type=1 (明文 TCP)

② 发送 SSL 请求 (CLIENT_SSL, 0x800)
   asio::write(*socket, 8-byte SSL_REQ)
   读服务器响应 → 'S' = 支持 SSL

③ TLS 握手
   ssl_context(tls_client)
   sslverify=ON → set_default_verify_paths() + verify_peer
   SNI         → sslhost.empty() ? host : sslhost
   主机名校验   → sslverify=ON 就做校验（sslhost 空 → host 兜底）
   handshake() 失败 → 错误信息带引导注释（查 CA / SSL_CERT_FILE / CN/SAN）
   sock_type=2 (TLS 已建立)

④ 重发 CLIENT_HANDSHAKE

⑤ Auth Switch 循环（有界 ≤4 次）
   sock_type=2 (SSL) 独立分支:
     - 0x03 fast auth 成功 → 等 OK/ERR
     - 0x04 公钥请求       → 明文发 password\0（TLS 已保护，不需要 RSA）

   sock_type=1 (非 SSL) 路径:
     - check_server_public_key() → EVP_PKEY_eq 比对
     - 不一致 → possible MITM → 密码不发出
     - 为空   → 直接信任（弱点，建议强制配置）</code></pre>

    <h3 id="mysql-auth-ssl-6">快速上手清单</h3>
    <pre><code># 0) 确认服务在跑
./bin/test_mysql_handshake 1

# 1) A 档：默认零配置
./bin/test_mysql_handshake 50

# 2) B 档加固：取服务器公钥 → 拷到客户端 → 配置
sudo cp /usr/local/var/mysql/public_key.pem <项目>/conf/public_key.pem
# orm.conf 里加一行：
# server_public_key=<项目>/conf/public_key.pem

# 3) C 档真安全：上 TLS
# ssl=ON + sslverify=ON + sslhost=证书域名
# 服务器 CA 放进系统信任库或设 SSL_CERT_FILE=ca.pem</code></pre>

    <h3 id="mysql-auth-ssl-7">错误信息速查</h3>
    <table>
        <thead><tr><th>error_msg 关键词</th><th>error_code</th><th>含义</th><th>处置</th></tr></thead>
        <tbody>
            <tr><td><code>possible MITM: server RSA public key mismatch (server fp=…, trusted fp=…)</code></td><td>4</td><td>钉住的公钥与服务器下发不一致，<strong>密码未发出</strong></td><td>比对两侧指纹：① 多个 MySQL/MariaDB 实例 → 钉错 datadir 公钥 ② 服务器换过密钥对 ③ 真中间人。更新本地 PEM</td></tr>

            <tr><td><code>#28000 Access denied for user …</code></td><td>1045</td><td><strong>公钥校验已通过</strong>，账号/密码/host 不匹配</td><td>检查密码、账号 host 限定（root@localhost vs root@%）</td></tr>
        </tbody>
    </table>

    <h2 id="orm-overview">ORM Overview</h2>

    <ul>
        <li>Uses a <strong>self-developed database connection protocol</strong> supporting MySQL PostgreSQL and SQLite — no need to install MySQL Connector/C++ or libpq separately</li>
        <li>Supports <strong>MySQL 8.0.4+</strong> (with <code>caching_sha2_password</code> authentication plugin)</li>

    <h2 id="orm-architecture">ORM Architecture</h2>
    <p>Paozhu ORM uses a <strong>self-developed database protocol</strong> (no external dependencies such as MySQL Connector/C++ or libpq). The overall architecture is divided into three layers: <strong>connection pool</strong>, <strong>model</strong>, and <strong>middleware layer</strong>, and provides <strong>two entry points</strong>:</p>
    <ul>
        <li><strong>Common CRUD entry</strong> — start by creating a model object from the <code>models</code> directory generated by the CLI (e.g., <code>orm::cms::Article()</code>), for everyday CRUD operations.</li>
        <li><strong>Pure SQL entry</strong> — execute native SQL and transactions directly via <code>orm::db_conn</code>, suitable for complex queries.</li>
    </ul>

    <h3 id="arch-config">Framework Loads Connection Configuration</h3>
    <p>At startup, the framework reads <code>conf/orm.conf</code> and builds a connection pool object (<code>orm_conn_pool</code>) for each data source tag. Each tag maintains three independent <strong>read</strong> and <strong>write</strong> connection pools for MySQL / PostgreSQL / SQLite, implemented by the self-developed <code>*_conn_base</code> protocol classes in <code>mysql_conn.h</code>, <code>pg_conn.h</code>, and <code>sqlite_conn.h</code>. The pools are supervised by the connection monitor (<code>orm_connect_mar_t</code>) in <code>orm_connect_mar.h</code>, which tracks active connections, records logs, and periodically clears idle connections.</p>

    <h3 id="arch-cli">CLI Generates ORM Artifacts (models Directory)</h3>
    <p>Running <code>./bin/paozhu_cli orm &lt;tag&gt;</code> makes the CLI code generator (<code>modelfun.hpp</code>) connect to the database, scan all table schemas, and auto-generate model files under <code>orm/&lt;tag&gt;/include/</code> (e.g., <code>*_base.h</code> data definitions + <code>*_opsql.h</code> operation classes), such as <code>orm/cms/include/article_base.h</code>. These models map database tables to C++ and are the <strong>object source for the CRUD entry</strong>.</p>

    <h3 id="arch-model">CRUD Entry: Model Objects Acquire Connections and Query</h3>
    <p>The model middleware layer (<code>mysqlorm.hpp</code>, <code>postgresqlorm.hpp</code>, <code>sqliteorm.hpp</code>) provides the template class <code>mysql_orm&lt;M_MODEL, B_BASE&gt;</code>. When business code creates a model object (e.g., <code>orm::cms::Article()</code>), the constructor looks up the corresponding <code>orm_conn_pool</code> by tag from the global connection pool registry <code>get_orm_conn_pool_obj()</code>, then executes CRUD operations through chained methods (<code>where()</code>, <code>fetch()</code>, <code>save()</code>, <code>update()</code>, <code>remove()</code>, etc.).</p>

    <h3 id="arch-native">Pure SQL Entry: Native SQL and Transactions</h3>
    <p><code>orm_query.h</code> provides the <code>orm::db_conn</code> wrapper (e.g., <code>orm::db_conn("cms")</code>) to execute native SQL and transactions directly (<code>begin_commit()</code> / <code>commit()</code> / <code>rollback()</code>). Connections are returned to the pool after use for reuse.</p>

    <div class="tip-box">
        💡 Summary: The overall flow is <strong>config file → framework loads orm.conf and initializes connection pools → CLI generates orm models directory → business code acquires a connection from the pool to query/write via the "CRUD entry (model object)" or the "pure SQL entry (orm::db_conn)" → return the connection</strong>.
    </div>

    <h3 id="orm-features">Core ORM Features</h3>
    <ul>
        <li>Multi-data-source configuration and switching</li>
        <li>Automatic model generation (<code>./bin/paozhu_cli orm <tag></code>)</li>
        <li>Chained query builder (where, whereAnd, fetch, fetch_one)</li>
        <li>Paginated queries</li>
        <li>Transaction handling</li>
        <li>Database connection pool management</li>
        <li>SSL encrypted connection support</li>
    </ul>

    <h2 id="config-datasource">Configuring Data Sources</h2>
    <p>Configure data sources in the <code>conf/orm.conf</code> file of your project. Each section (tag) can hold multiple data sources: use <code>type = main</code> for the primary and <code>type = second</code> for the replica. The example below configures both primary and replica for the default tag:</p>
    <pre><code>[default]
type = main
host = 127.0.0.1
port = 3306
dbname = cppcms
user = root
password = 12345678
pretable =
maxpool = 5
dbtype = mysql
charset = utf8mb4

type = second
host = 127.0.0.1
port = 3306
dbname = cppcms
user = root
password = 12345678
pretable =
maxpool = 5
dbtype = mysql
charset = utf8mb4</code></pre>

    <h3 id="config-params">Configuration Parameters</h3>
    <h4>Basic Parameters</h4>
    <ul>
        <li><code>type</code> — Database role, options: <code>main</code> (primary), <code>second</code> (replica)</li>
        <li><code>host</code> — Database server address</li>
        <li><code>port</code> — Database server port</li>
        <li><code>dbname</code> — Database name</li>
        <li><code>user</code> — Database username</li>
        <li><code>password</code> — Database password</li>
        <li><code>pretable</code> — Table prefix for distinguishing tables from different business modules</li>
        <li><code>maxpool</code> — Maximum number of connections in the pool</li>
        <li><code>dbtype</code> — Database type identifier (e.g., <code>mysql</code>, <code>postgresql</code>)</li>
        <li><code>charset</code> — Database character set (e.g., <code>utf8</code>, <code>utf8mb4</code>)</li>
    </ul>

    <h4>SSL Encryption Parameters</h4>
    <ul>
        <li><code>ssl</code> — Enable SSL connection, options: <code>ON</code>, <code>OFF</code> (default)</li>
        <li><code>sslverify</code> — Verify certificate chain, options: <code>ON</code>, <code>OFF</code>; when enabled, verifies that the server certificate is signed by a trusted CA (uses system CA certificates or <code>SSL_CERT_FILE</code> environment variable)</li>
        <li><code>sslhost</code> — Certificate domain (SNI + domain verification); when empty, only verifies the certificate chain without checking the domain name; when specified, verifies both the chain and domain match</li>
    </ul>

    <div class="tip-box">
        💡 Tip: <code>[default]</code> is the default data source and can be used without specifying a data source name. Other data sources need to be accessed through their namespace (e.g., <code>orm::cms::Tablename()</code>). SSL parameters are commented out by default—uncomment and modify them when needed.
    </div>

    <h4>SSL Configuration Example</h4>
    <pre><code>[cms]
type     = main
host     = 127.0.0.1
port     = 3306
dbname   = cppcms
user     = root
password = 12345678
pretable = 
maxpool  = 5
dbtype   = mysql
charset  = utf8mb4

# Enable SSL with certificate chain and domain verification
ssl      = ON
sslverify = ON
sslhost  = db.example.com</code></pre>

    <h2 id="create-model">Creating Models</h2>
    <p>Paozhu uses a <strong>command-line tool to automatically generate</strong> ORM model files—no manual coding required. Use the <code>paozhu_cli orm</code> command to auto-generate models for all tables based on the configuration tags in <code>orm.conf</code>.</p>

    <h3 id="cli-generate">Generating Models with CLI</h3>
    <p>First, make sure your database connection tags (e.g., <code>[cms]</code>, <code>[docs]</code>, <code>[ph]</code>) are configured in <code>orm.conf</code>, then run:</p>
    <pre><code># Generate ORM models for the cms tag (tag name corresponds to the section in orm.conf)
./bin/paozhu_cli orm cms

# Generate ORM models for the default tag
./bin/paozhu_cli orm default

# Generate ORM models for the ph (PostgreSQL) tag
./bin/paozhu_cli orm ph</code></pre>

    <h3 id="generated-structure">Generated File Structure</h3>
    <p>After running the command, the framework will automatically generate the following structure in the <code>orm/</code> directory:</p>
    <pre><code>orm/
├── orm.h                    # Unified entry header file
├── cms/
│   └── include/
│       ├── article_base.h   # Article model base class (auto-generated)
│       ├── article_opsql.h  # Article operation class (auto-generated)
│       ├── catalogue_base.h
│       └── ...
├── docs/
│   └── include/
│       └── ...
└── ph/
    └── include/
        └── ...</code></pre>

    <h3 id="use-model">Using Generated Models</h3>
    <p>To use the generated models in your controller, just <code>#include "orm.h"</code>, then create model instances through their namespace:</p>
    <pre><code>#include "orm.h"

// Use the Article model with the cms tag
auto articles = orm::cms::Article();

// Use the Sysuser model with the cms tag
auto users = orm::cms::Sysuser();

// Use the default tag models (benchmark tables World/Fortune)
auto worlds = orm::World();

// Use the Fortune model with the ph (PostgreSQL) tag
auto fortunes = orm::ph::Fortune();</code></pre>

    <div class="tip-box">
        💡 Tip: Model files are auto-generated by the CLI tool. <strong>Do not manually modify them</strong>. If your database table structure changes, simply re-run <code>./bin/paozhu_cli orm <tag></code> to update the models.
    </div>

    <h3 id="model-features">Model Features</h3>
    <ul>
        <li>Auto-generated field type definitions (<code>orm::cms::article_info::type::aid</code>)</li>
        <li>Built-in <code>meta</code> struct for storing field data</li>
        <li>JSON serialization support (<code>to_json()</code>)</li>
        <li>Tree structure support (<code>meta_tree</code>, <code>meta_tree_ptr</code>)</li>
        <li>Auto-generated SQL statements (INSERT, UPDATE, DELETE)</li>
        <li>Support for <code>obj_val</code> and <code>meta</code> interconversion</li>
    </ul>

    <h2 id="query-data">Querying Data</h2>
    <p>Paozhu ORM provides various query methods and supports chained calls to construct query conditions.</p>

    <h3 id="query-all">Retrieve All Records</h3>
    <pre><code>// Retrieve all records
auto articles = orm::cms::Article();
articles.where("isopen", 1).fetch();</code></pre>

    <h3 id="query-conditional">Conditional Query</h3>
    <pre><code>// Multi-condition query
articles.where("userid", 1).whereAnd("isopen", 1).fetch();</code></pre>

    <h3 id="query-single">Retrieve a Single Record</h3>
    <pre><code>// Retrieve a single record
users.where("name", username).whereAnd("password", md5string).fetch_one();</code></pre>

    <h3 id="query-pagination">Paginated Query</h3>
    <pre><code>// Paginated query
auto [bar_min, bar_max, current_page, total_page] = articles.page(page, 10, 5);</code></pre>
    <ul>
        <li><code>page</code> — Current page number</li>
        <li><code>10</code> — Number of records per page</li>
        <li><code>5</code> — Number of page numbers displayed in the pagination bar</li>
    </ul>

    <h2 id="insert-data">Inserting Data</h2>
    <p>Use the model's setter methods to set field values, then call the <code>save()</code> method to insert a new record:</p>
    <pre><code>auto articles = orm::cms::Article();
articles.setIsopen(1);
articles.setCreatetime(get_date("%Y-%m-%d %X"));  // Formatted time
articles.setAddtime(timeid());                    // Unix timestamp
articles.setAddip(client.client_ip);               // Client IP
articles.setTitle("New Title");
articles.setContent("Content");

// save() returns [affected_rows, auto_increment_id]
auto[effectnum, last_id] = articles.save();
if (effectnum &#62; 0)
{
    int new_id = articles.getAid();  // Get the new record ID
    client.goto_url("/cms/list", 3, "Added successfully");
}</code></pre>

    <div class="tip-box">
        💡 Tip: The <code>save()</code> method is used to insert new records. After successful insertion, you can use getter methods like <code>getAid()</code> to obtain the auto-increment ID.
    </div>

    <h2 id="update-data">Updating Data</h2>
    <p>First set new values through setter methods, then specify update conditions via <code>where()</code>, and finally call the <code>update()</code> method with the fields to update:</p>
    <pre><code>auto articles = orm::cms::Article();
articles.setTitle("Updated Title");
articles.setContent("Updated Content");

// Specify update conditions and fields to update
articles.where("aid", aid);
int effectnum = articles.update("title,content");

if (effectnum &#62; 0)
{
    client.goto_url("/cms/list", 3, "Updated successfully");
}</code></pre>

    <div class="tip-box">
        💡 Tip: The <code>update()</code> method parameter specifies which fields to update (comma-separated). You can also use <code>update()</code> without parameters to update <strong>all</strong> fields in <code>article.data</code>, but you must ensure the primary key is set, otherwise an error will occur. Always use <code>where()</code> or set the primary key before calling update.
    </div>

    <h2 id="delete-data">Deleting Data</h2>
    <p>Use the <code>remove()</code> method to directly delete a record by its ID:</p>
    <pre><code>auto articles = orm::cms::Article();

// Delete a record by its ID
int effectnum = articles.remove(aid);

if (effectnum &#62; 0)
{
    client.goto_url("/cms/list", 3, "Deleted successfully");
}</code></pre>

    <div class="tip-box">
        💡 Tip: The <code>remove(id)</code> method deletes a record directly by its primary key. For conditional or batch deletions, call <code>remove()</code> together with <code>where()</code> or <code>whereIn()</code> conditions.
    </div>

    <h2 id="advanced-query">Advanced Query Methods</h2>

    <h3 id="query-order">Sorting Queries</h3>
    <pre><code>// Using order() for sorting
articles.order("aid desc").fetch();

// Using asc() for ascending
articles.where("userid", 0).asc("addtime").fetch();

// Using desc() for descending
articles.desc("addtime").fetch();</code></pre>

    <h3 id="query-select">Selecting Specific Fields</h3>
    <pre><code>// Query only needed fields
articles.select("aid,title,summary").where("userid", 0).fetch();</code></pre>

    <h3 id="query-limit">Limiting Query Results</h3>
    <pre><code>// Limit query results
articles.where("userid", 1).limit(1).fetch_one();
articles.limit(10).fetch();</code></pre>

    <h3 id="query-count">Count Queries</h3>
    <pre><code>// Count total records
unsigned int total = articles.where("userid", userid).count();

// Count records matching conditions
total = articles.where("userid", userid).where("addtime", "&#62;", lastweek_time).count();</code></pre>

    <h3 id="query-wherein">IN Condition Queries</h3>
    <pre><code>// Using whereIn to query multiple IDs
std::string aid_sql_str = "1,2,3";
articles.whereIn("aid", aid_sql_str).fetch();</code></pre>

    <h3 id="query-operators">Operator Queries</h3>
    <pre><code>// Supports operators like greater than, less than
articles.where("addtime", "&#62;", lastweek_time).fetch();
articles.where("readnum", "&#60;", 100).fetch();
articles.where("isopen", "!=", 0).fetch();</code></pre>

    <h2 id="field-update">Field Update Operations</h2>

    <h3 id="field-inc">Field Increment/Decrement</h3>
    <pre><code>// Increment (positive number)
model.where("aid", id).update_col("readnum", 1);   // readnum + 1

// Decrement (negative number)
model.where("aid", id).update_col("stock", -1);    // stock - 1</code></pre>

    <h3 id="field-replace">Field Replacement</h3>
    <pre><code>// Replace specified string in field content
model.where("aid", id).replace_col("content", "old", "new");</code></pre>

    <h2 id="data-access">Data Access Methods</h2>

    <h3 id="access-getter">Using Getter Methods</h3>
    <pre><code>// Single record
model.where("aid", id).fetch_one();
std::string title = model.getTitle();
int userid = model.getUserid();
unsigned int pk = model.getPK();</code></pre>

    <h3 id="access-record">Iterating Over Result Sets</h3>
    <pre><code>// Multiple record iteration
model.where("userid", 1).fetch();
for (auto &record : model.record)
{
    std::cout << record.aid << ": " << record.title << std::endl;
}</code></pre>

    <h3 id="access-data">Direct Access to Data Structure</h3>
    <pre><code>// Directly access data structure (besides setter/getter)
model.data.title = "New Title";
model.data.content = "New Content";
model.save();</code></pre>

    <h2 id="async-orm">Async ORM Operations</h2>
    <p>Use async ORM methods in coroutines. All async methods are prefixed with <code>async_</code>:</p>

    <h3 id="async-methods">Available Async ORM Methods</h3>
    <table>
        <thead>
            <tr>
                <th>Sync Method</th>
                <th>Async Method</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr><td><code>fetch()</code></td><td><code>async_fetch()</code></td><td>Query all matching records</td></tr>
            <tr><td><code>fetch_one()</code></td><td><code>async_fetch_one()</code></td><td>Query a single record</td></tr>
            <tr><td><code>fetch_append()</code></td><td><code>async_fetch_append()</code></td><td>Query and append to existing result set</td></tr>
            <tr><td><code>count()</code></td><td><code>async_count()</code></td><td>Count matching records</td></tr>
            <tr><td><code>save()</code></td><td><code>async_save()</code></td><td>Insert a new record</td></tr>
            <tr><td><code>update()</code></td><td><code>async_update()</code></td><td>Update a record</td></tr>
            <tr><td><code>remove()</code></td><td><code>async_remove()</code></td><td>Delete a record</td></tr>
        </tbody>
    </table>

    <h3 id="async-example">Async Usage Example</h3>
    <pre><code>// Using async ORM in coroutines
#include "orm.h"

asio::awaitable&#60;void&#62; handle_request()
{
    auto model = orm::cms::Article();
    
    // Async queries
    co_await model.async_fetch();
    co_await model.async_count();
    
    // Async operations
    co_await model.async_save();
    co_await model.async_update();
    co_await model.async_remove();
}</code></pre>

    <h3 id="async-practical">Practical Examples (from techempower.cpp)</h3>

    <h4>Async Query Single Record</h4>
    <pre><code>// Randomly query a World record
//@urlpath(null,db)
asio::awaitable&#60;std::string&#62; techempowerdb(std::shared_ptr&#60;httppeer&#62; peer)
{
    peer-&#62;type("application/json; charset=UTF-8");
    auto myworld = orm::World();
    unsigned int rd_num = rand_range(1, 10000);
    myworld.where("id", rd_num);
    myworld.limit(1);
    co_await myworld.async_fetch_one();  // Async query single
    
    peer->output = myworld.data_tojson();
    co_return "";
}</code></pre>

    <h4>Async Batch Query (Connection Lock Reuse)</h4>
    <pre><code>// Lock connection for multiple queries to avoid reconnection overhead
//@urlpath(null,queries)
asio::awaitable&#60;std::string&#62; techempowerqueries(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer->get["queries"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    myworld.record.reserve(get_num);
    myworld.lock_conn();  // Lock connection
    
    for (unsigned int i = 0; i &#60; get_num; i++)
    {
        myworld.wheresql.clear();
        unsigned int rd_num = rand_range(1, 10000);
        myworld.where("id", rd_num);
        co_await myworld.async_fetch_append();  // Append query result
    }
    
    myworld.unlock_conn();  // Unlock connection
    peer-&#62;output = myworld.to_json();
    co_return "";
}</code></pre>

    <h4>Async Query All Records</h4>
    <pre><code>// Query all Fortunes and sort
//@urlpath(null,fortunes)
asio::awaitable&#60;std::string&#62; techempowerfortunes(std::shared_ptr&#60;httppeer&#62; peer)
{
    auto myfortune = orm::Fortune();
    co_await myfortune.async_fetch();  // Async query all
    
    myfortune.data.id = 0;
    myfortune.data.message = "Additional fortune added at request time.";
    myfortune.record.push_back(myfortune.data);
    
    // Sort
    std::sort(myfortune.record.begin(), myfortune.record.end(), 
              [](const auto &lhs, const auto &rhs) {
                  return lhs.message < rhs.message;
              });
    
    // Output to view
    peer-&#62;val["list"].set_array();
    for (auto &record : myfortune.record)
    {
        obj_val item;
        item["id"] = record.id;
        item["message"] = html_encode(record.message);
        peer-&#62;val["list"].push(item);
    }
    peer-&#62;view("techempower/fortunes");
    co_return "";
}</code></pre>

    <h4>Async Update Operation</h4>
    <pre><code>// Batch update random numbers
//@urlpath(null,updates)
asio::awaitable&#60;std::string&#62; techempowerupdates(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer-&#62;get["queries"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    myworld.record.clear();
    myworld.record.reserve(get_num);
    myworld.lock_conn();  // Lock connection
    
    for (unsigned int i = 0; i &#60; get_num; i++)
    {
        myworld.wheresql.clear();
        myworld.where("id", rand_range(1, 10000));
        co_await myworld.async_fetch_append();
        
        if (myworld.effect() &#62; 0)
        {
            unsigned int j = myworld.record.size() - 1;
            myworld.data.randomnumber = rand_range(1, 10000);
            myworld.record[j].randomnumber = myworld.data.randomnumber;
            co_await myworld.async_update("randomnumber");  // Async update specified field
        }
    }
    
    myworld.unlock_conn();
    peer-&#62;output = myworld.to_json();
    co_return "";
}</code></pre>

    <h4>Cache + Database Combined Query</h4>
    <pre><code>// Check cache first, query database on cache miss
//@urlpath(null,cached-db)
asio::awaitable&#60;std::string&#62; techempowercached_db(std::shared_ptr&#60;httppeer&#62; peer)
{
    unsigned int get_num = peer-&#62;get["count"].to_int();
    if (get_num == 0) get_num = 1;
    else if (get_num &#62; 500) get_num = 500;
    
    auto myworld = orm::World();
    std::string mycacheid = "my" + std::to_string(get_num);
    
    // Get cache connection
    pzcache&#60;std::vector&#60;orm::world_info::meta&#62;&#62; &temp_cache = 
        pzcache&#60;std::vector&#60;orm::world_info::meta&#62;&#62;::conn();
    
    myworld.record.reserve(get_num);
    
    if (temp_cache.check(mycacheid) &#62; -1)
    {
        // Cache hit
        myworld.record = temp_cache.get(mycacheid);
    }
    else
    {
        // Cache miss, query database
        std::vector&#60;unsigned int&#62; cacheid;
        for (unsigned int i = 0; i &#60; get_num; i++)
        {
            cacheid.push_back(rand_range(1, 10000));
        }
        
        std::string sqlstr = array_to_sql(cacheid);
        myworld.whereIn("id", sqlstr);
        co_await myworld.async_fetch();  // Async IN query
        
        // Write to cache
        temp_cache.save(mycacheid, myworld.record, 360);
    }
    
    peer-&#62;output = myworld.to_json();
    co_return "";
}</code></pre>

    <div class="tip-box">
        💡 Note: Synchronous controllers (returning <code>std::string</code>) and coroutine controllers (returning <code>asio::awaitable<std::string></code>) can be mixed in the same project. The framework automatically selects the correct execution path based on the function signature.
    </div>

    <h2 id="native-sql">Native SQL Queries</h2>
    <p>When you need to execute complex SQL or queries not supported by ORM, use the <code>orm::db_conn</code> independent database connection:</p>
    <pre><code>#include "orm.h"
#include "orm_query.h"

// 1. Define the result structure
namespace orm::cust
{
    struct LocalusersqlStruct : orm::Base&#60;LocalusersqlStruct&#62;
    {
        unsigned int adminid;
        std::string name;
        std::string nickname;
        ORM_NAMES(adminid, name, nickname);
    };
}

// 2. Execute SQL query
std::vector&#60;orm::cust::LocalusersqlStruct&#62; loaduser;
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");

std::string sqlstring = "SELECT adminid,name,nickname FROM sysuser where 1 limit 1";
ulink-&#62;query(sqlstring, loaduser);

// 3. Read results
for (auto &row : loaduser)
{
    client &#60;&#60; "adminid:" &#60;&#60; row.adminid &#60;&#60; ", name:" &#60;&#60; row.name;
}</code></pre>

    <div class="tip-box">
        💡 Note: The SELECT fields in SQL must correspond one-to-one with the returned struct fields.
    </div>

    <h2 id="transaction">Transaction Handling</h2>
    <p>Use <code>orm::db_conn</code> independent database connections for transaction handling to ensure the atomicity of multiple operations.</p>

    <h3 id="transaction-basic">Basic Transaction Operations</h3>
    <pre><code>#include "orm.h"
#include "orm_query.h"

// 1. Create an independent database connection (tag corresponds to orm.conf config)
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");

// 2. Start a transaction
bool is_begin = ulink-&#62;begin_commit();

if (is_begin)
{
    try
    {
        // 3. Execute multiple database operations
        ulink-&#62;edit_query("UPDATE sysuser SET nickname = 'New Name' WHERE adminid = 10000");
        if (ulink-&#62;iserror)
        {
            ulink-&#62;rollback();  // Rollback on error
        }
        else
        {
            ulink-&#62;edit_query("INSERT INTO sysuser (adminid, name) VALUES (10001, 'test')");
            if (ulink-&#62;iserror)
            {
                ulink-&#62;rollback();  // Rollback on error
            }
            else
            {
                // 4. Commit the transaction
                ulink-&#62;commit();
            }
        }
    }
    catch (const std::exception& e)
    {
        ulink-&#62;rollback();
    }
}</code></pre>

    <h3 id="transaction-with-structure">Transaction with Query Results</h3>
    <pre><code>// Define the result structure
namespace orm::cust
{
    struct UserStruct : orm::Base&#60;UserStruct&#62;
    {
        unsigned int adminid;
        std::string name;
        std::string nickname;
        ORM_NAMES(adminid, name, nickname);
    };
}

// Query and modify data within a transaction
auto ulink = std::make_unique&#60;orm::db_conn&#62;("cms");
orm::cust::UserStruct commit_data;

if (ulink-&#62;begin_commit())
{
    try
    {
        // Update operation
        ulink-&#62;edit_query("UPDATE sysuser SET nickname = 'Nice Name' WHERE adminid = 10000");
        if (!ulink-&#62;iserror)
        {
            // Insert operation
            ulink-&#62;edit_query("INSERT INTO sysuser (adminid, name) VALUES (NULL, 'userroot')");
            if (!ulink-&#62;iserror)
            {
                // Query operation (using the same connection)
                ulink-&#62;edit_query(
                    "SELECT adminid, name, nickname FROM sysuser WHERE adminid = 10000 LIMIT 1",
                    commit_data  // Results stored in struct
                );
                if (!ulink-&#62;iserror)
                {
                    ulink-&#62;commit();  // Commit
                }
                else
                {
                    ulink-&#62;rollback();
                }
            }
            else
            {
                ulink-&#62;rollback();
            }
        }
        else
        {
            ulink-&#62;rollback();
        }
    }
    catch (const std::exception& e)
    {
        ulink-&#62;rollback();
    }
}

// Read results
if (commit_data.adminid != 0)
{
    std::cout &#60;&#60; "adminid: " &#60;&#60; commit_data.adminid 
              &#60;&#60; ", name: " &#60;&#60; commit_data.name &#60;&#60; std::endl;
}</code></pre>

    <h3 id="transaction-orm">Using ORM Objects to Generate SQL</h3>
    <pre><code>// Recommended: Use ORM objects to generate SQL, then commit with transaction
auto user_m = orm::cms::Sysuser();

// Get INSERT SQL

std::string insert_sql = user_m.commit_insert();

// Get UPDATE SQL

std::string update_sql = user_m.commit_update("nickname");

// Get DELETE SQL

// Then use db_conn to execute these SQL and commit the transaction

if (ulink-&#62;begin_commit())
{
    ulink-&#62;edit_query(insert_sql);
    if (!ulink-&#62;iserror)
    {
        ulink-&#62;edit_query(update_sql);
        if (!ulink-&#62;iserror)
        {
            ulink-&#62;commit();

        }
    }
    else

    }

    <div class="tip-box">
        💡 Tip:
        <ul>
            <li><code>begin_commit()</code> — Start a transaction, returns <code>bool</code> indicating success</li>
            <li><code>edit_query(sql)</code> — Execute write operations (INSERT/UPDATE/DELETE), check for errors via <code>iserror</code></li>
            <li><code>edit_query(sql, result)</code> — Execute query operation, results stored in struct</li>
            <li><code>commit()</code> — Commit the transaction</li>
            <li><code>rollback()</code> — Rollback the transaction</li>
        </ul>
        Transaction handling is important for scenarios requiring data consistency, such as transfers and order processing. If any operation in the transaction fails, the entire transaction will be rolled back.
    </div>

    <h2 id="connection-pool">Database Connection Pool</h2>
    <p>Paozhu ORM uses a connection pool to manage database connections. The <code>maxpool</code> parameter in <code>orm.conf</code> controls the maximum number of connections for each data source:</p>
    <ul>
        <li>A larger <code>maxpool</code> value supports more concurrent requests</li>
        <li>Each data source independently manages its own connection pool</li>
        <li>Idle connections are automatically recycled to avoid resource waste</li>
        <li>The connection pool supports automatic reconnection, allowing recovery after network issues</li>
    </ul>
    <div class="tip-box">
        💡 Recommendation: Set <code>maxpool</code> to 2-3 times the number of business threads. The exact value should be adjusted based on your actual business scenarios and database capacity.
    </div>

    <h2 id="db-migration">Database Migration</h2>
    <p>Migration between databases (MySQL &lt;=&gt; PostgreSQL &lt;=&gt; SQLite)</p>
    <p>Use the CLI tool to migrate data between database types (e.g., from MySQL/CMS to PostgreSQL). Target tables are created automatically:</p>
    <pre><code># Migrate from cms to pg
./bin/paozhu_cli dbconver cms pg

# Force migration (overwrite existing tables)
./bin/paozhu_cli dbconver cms pg force</code></pre>
    <div class="tip-box">
        💡 Tip: Before migrating, make sure the target database exists and the connection settings in <code>orm.conf</code> are correct. Without <code>force</code>, existing target tables are skipped to avoid accidentally overwriting data.
    </div>

    <h2 id="sql-export">SQL Export</h2>
    <p>Export database schema or data to SQL files for backup, migration, or distribution:</p>
    <pre><code># Export table schema
./bin/paozhu_cli dbtable cms ./schema.sql
./bin/paozhu_cli dbtable cms ./pg.sql -target=pg      # Export as PG syntax

# Export schema + data
./bin/paozhu_cli dbexport cms ./dump.sql
./bin/paozhu_cli dbexport cms ./mysql.sql -target=mysql</code></pre>
    <div class="tip-box">
        💡 Tip: By default, the SQL dialect of the current data source is used. You can specify the target database syntax with <code>-target=pg</code> / <code>-target=mysql</code> to facilitate migration between different databases.
    </div>

    <h2 id="mariadb-caching-sha2">Switching MariaDB to caching_sha2_password Authentication Plugin</h2>
    <p>Paozhu ORM's built-in self-developed database client supports <code>caching_sha2_password</code> authentication. MySQL 8.0 uses this plugin by default, while MariaDB (10.x ~ 11.x) defaults to <code>mysql_native_password</code> — you need to manually switch to align with MySQL 8.0 authentication behavior. MariaDB 12.1+ has native support for <code>caching_sha2_password</code>.</p>

    <h3 id="mariadb-caching-sha2-1">Step 1: Install the Authentication Plugin</h3>
    <p>Log into MariaDB as root and install the <code>auth_mysql_sha2</code> plugin (which implements <code>caching_sha2_password</code>):</p>
    <pre><code># Log into MariaDB
mysql -uroot -p

# Install the caching_sha2_password plugin
INSTALL SONAME 'auth_mysql_sha2';

# Verify the plugin is loaded
SELECT plugin_name, plugin_status FROM mysql.plugin WHERE plugin_name LIKE '%sha2%';</code></pre>
    <div class="tip-box">
        💡 Tip: If <code>INSTALL SONAME 'auth_mysql_sha2'</code> fails with a plugin file-not-found error, make sure your MariaDB version ≥ 10.11 and that <code>auth_mysql_sha2.so</code> (Linux) or <code>auth_mysql_sha2.dylib</code> (macOS) exists under your <code>plugin_dir</code>. Check the plugin directory with <code>SHOW VARIABLES LIKE 'plugin_dir';</code>.
    </div>

    <h3 id="mariadb-caching-sha2-2">Step 2: Switch the User Authentication Plugin</h3>
    <p>Switch the target user (e.g., root) to <code>caching_sha2_password</code> and set a new password hash:</p>
    <pre><code>-- Option 1: Directly update the mysql.user table (for existing users)
UPDATE mysql.user
SET plugin='caching_sha2_password',
    authentication_string=PASSWORD('12345678')
WHERE user='root' AND host='localhost';

-- Option 2: Use ALTER USER syntax (recommended for MariaDB 10.11+)
ALTER USER 'root'@'localhost' IDENTIFIED BY '12345678';
ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '12345678';

-- Flush privileges to apply changes
FLUSH PRIVILEGES;</code></pre>

    <h3 id="mariadb-caching-sha2-3">Step 3: Configure Default Authentication Plugin (Optional)</h3>
    <p>If you want new users to default to <code>caching_sha2_password</code>, add the following under the <code>[mysqld]</code> section of your MariaDB config file (<code>my.cnf</code> or <code>my.ini</code>):</p>
    <pre><code>[mysqld]
# Set default authentication plugin
default_authentication_plugin = caching_sha2_password

# Ensure the plugin is loaded at startup
plugin_load_add = auth_mysql_sha2</code></pre>
    <p>Restart MariaDB after modifying the configuration:</p>
    <pre><code># macOS (Homebrew)
brew services restart mariadb

# Linux (systemd)
sudo systemctl restart mariadb

# Docker
docker restart &#60;container_name&#62;</code></pre>

    <h3 id="mariadb-caching-sha2-4">Step 4: Generate RSA Keys (Required for Non-SSL Connections)</h3>
    <p>When using <code>caching_sha2_password</code> authentication, if the client and server are <strong>not using an SSL-encrypted connection</strong>, the password must be encrypted in transit using an RSA key pair. MariaDB reads <code>private_key.pem</code> and <code>public_key.pem</code> from the data directory at startup to perform the RSA exchange, so you must generate them in advance.</p>
    <div class="tip-box">
        💡 Data Directory Note: On macOS with Homebrew, the data directory is usually <code>/usr/local/var/mysql</code> (or <code>/opt/homebrew/var/mysql</code> on Apple Silicon). The directory happens to be named <code>mysql</code> — it is not another MySQL instance. All database files, error logs, and the <code>mysql.user</code> table live here, so generating the RSA keys in this directory is correct.
    </div>
    <p>Enter the data directory and run the following commands in order:</p>
    <pre><code># 1. Enter the data directory
cd /usr/local/var/mysql

# 2. Generate the RSA private and public keys (using OpenSSL)
openssl genrsa -out private_key.pem 2048
openssl rsa -in private_key.pem -pubout -out public_key.pem

# 3. Adjust file permissions (ensure the MariaDB process can read them)
chmod 644 private_key.pem public_key.pem
chown $(whoami):admin private_key.pem public_key.pem   # ignore if your group is not admin</code></pre>
    <p>After generating the keys, restart MariaDB so it loads them at startup:</p>
    <pre><code># macOS (Homebrew)
brew services restart mariadb</code></pre>
    <div class="tip-box">
        💡 Tip: If your client uses an SSL connection (set <code>ssl = ON</code> in <code>orm.conf</code>), no RSA exchange is needed and this step can be skipped. RSA is only used to encrypt the password over non-SSL connections.
    </div>

    <h3 id="mariadb-caching-sha2-5">Verify the Switch</h3>
    <pre><code>-- Check the authentication plugin for the current user
SELECT user, host, plugin FROM mysql.user WHERE user='root';

-- Test a new connection (using the new password)
mysql -uroot -p12345678 -e "SELECT VERSION();"</code></pre>
    <p>If the <code>plugin</code> column shows <code>caching_sha2_password</code> and you can log in normally, the switch was successful.</p>

    <div class="warn-box">
        ⚠️ Note: After switching the authentication plugin, older clients that use <code>mysql_native_password</code> (e.g., legacy mysql CLI tools, some ORM frameworks) will no longer be able to connect. Make sure all your clients support the <code>caching_sha2_password</code> protocol before switching. Paozhu ORM has supported this plugin from the start, so it's safe to use.
    </div>

    <h3 id="mariadb-caching-sha2-6">Rollback</h3>
    <p>If you run into issues after switching, roll back to <code>mysql_native_password</code> as follows:</p>
    <pre><code># Log in as root (if you still can)
mysql -uroot -p

# Roll back the authentication plugin
ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '12345678';
FLUSH PRIVILEGES;

# If you can't log in, start MariaDB temporarily skipping grant tables:
# mysqld --skip-grant-tables
# Then run: UPDATE mysql.user SET plugin='mysql_native_password' WHERE user='root';
# FLUSH PRIVILEGES; and restart normally</code></pre>


    <h2 id="mysql-auth-ssl">MySQL/MariaDB Authentication &amp; SSL Configuration Guide</h2>
    <p>Paozhu ORM's built-in database client fully supports <code>caching_sha2_password</code> authentication (default in MySQL 8.0+, native in MariaDB 12.1+). This chapter covers three authentication tiers, RSA key management, the complete SSL=ON flow, and hardening.</p>

    <h3 id="mysql-auth-ssl-1">Authentication Tiers at a Glance</h3>
    <table>
        <thead><tr><th>Tier</th><th>Config</th><th>Eavesdrop Protection</th><th>MITM Public Key Swap (CVE-2015-3152)</th><th>SSL Downgrade Protection</th><th>Recommended For</th></tr></thead>
        <tbody>
            <tr><td><strong>A Compat (default)</strong></td><td>Nothing</td><td>❌ Plaintext</td><td>❌</td><td>❌</td><td>Local dev, same-machine Unix socket</td></tr>
            <tr><td><strong>B Public Key Pinning</strong></td><td><code>server_public_key=/path/to/public_key.pem</code></td><td>❌ Plaintext</td><td>✅ Blocked before password sent</td><td>❌</td><td>Trusted LAN without TLS; need ARP spoof protection</td></tr>
            <tr><td><strong>C TLS (recommended)</strong></td><td><code>ssl=ON</code> + <code>sslverify=ON</code> + <code>sslhost=domain</code></td><td>✅ TLS encrypted</td><td>✅ Not using RSA</td><td>✅ A3 guard forces encryption</td><td>Production, cross-network</td></tr>
        </tbody>
    </table>
    <div class="tip-box">
        💡 <strong>Important</strong>: Tier B only protects the authentication phase — SQL and result sets remain plaintext. Tier C is the complete security solution.<br>
        MariaDB 12.3+ <em>always</em> sends an Auth More Data public key request (unlike MySQL, which may hit fast auth cache). TLS OFF with no pinning = every authentication is exposed.
    </div>

    <h3 id="mysql-auth-ssl-2">Find the Server RSA Public Key</h3>
    <p><code>caching_sha2_password</code> uses an RSA key pair to encrypt passwords. MySQL 8+ <strong>auto-generates</strong> the pair during datadir initialization:</p>
    <pre><code># MySQL (Homebrew)
/usr/local/mysql/data/public_key.pem

# MariaDB (Homebrew) — directory happens to be named "mysql"; it's MariaDB's datadir
/usr/local/var/mysql/public_key.pem

# Linux
/var/lib/mysql/public_key.pem

# Verify fingerprint (must match the PEM you pin on the client)
openssl pkey -pubin -in /usr/local/var/mysql/public_key.pem -outform DER | openssl dgst -sha256</code></pre>

    <h3 id="mysql-auth-ssl-3">Keys Missing? Generate Them Manually</h3>
    <p>Example for MariaDB (MySQL 8 usually has them pre-generated):</p>
    <pre><code># 1. Enter the data directory
cd /usr/local/var/mysql          # MariaDB (Homebrew)
# cd /usr/local/mysql/data      # MySQL (Homebrew)

# 2. Generate RSA key pair (2048-bit is enough, OAEP payload ≤ 32 bytes)
openssl genrsa -out private_key.pem 2048
openssl rsa    -in private_key.pem -pubout -out public_key.pem

# 3. Permissions: private key DB-process-only, public key world-readable
chmod 600 private_key.pem        # 🔴 NEVER 644! Leaked private key = offline password decryption
chmod 644 public_key.pem
chown $(whoami):admin private_key.pem public_key.pem   # Homebrew: hzq:admin

# 4. Self-check: public key must be derivable from private key
openssl rsa -in private_key.pem -pubout | diff - public_key.pem &amp;&amp; echo "keypair OK"

# 5. Restart — keys are read once at startup; no restart = no effect
brew services restart mariadb   # or: mysql.server restart</code></pre>

    <div class="tip-box">
        ⚠️ <strong>Security Red Line</strong>: <code>private_key.pem</code> must be <code>0600</code> owned by the DB process user.<br>
        <code>chmod 644 private_key.pem</code> (common tutorial typo) lets any local user: ① decrypt captured auth packets offline; ② impersonate the server to bypass Tier B pinning. Tier B becomes worthless.<br>
        <strong>Never copy private_key.pem to the client</strong>. Tier B only copies <code>public_key.pem</code>.
    </div>

    <h3 id="mysql-auth-ssl-4">Configuration</h3>
    <p>Open <code>conf/orm.conf</code>, find your dbtag [docs] section, and add:</p>
    <pre><code>[docs]
type     = main
host     = 127.0.0.1
port     = 3306
dbname   = hello_world
user     = root
password = 12345678
pretable = web_
maxpool  = 5
dbtype   = mysql
charset  = utf8mb4

; ===== Tier B: Public Key Pinning =====
; server_public_key=/Users/hzq/cpp/sqliteconn/conf/public_key.pem

; ===== Tier C: TLS (recommended) =====
; ssl=ON
; sslverify=ON
; sslhost=db.example.com     ; domain in cert CN/SAN, falls back to host if empty</code></pre>

    <h3 id="mysql-auth-ssl-5">Complete SSL ON Authentication Flow</h3>
    <pre><code>① TCP connect
   host:3306 → sock_type=1 (plaintext TCP)

② Send SSL Request (CLIENT_SSL, 0x800)
   asio::write(*socket, 8-byte SSL_REQ)
   Read response → 'S' = server supports SSL

③ TLS Handshake
   ssl_context(tls_client)
   sslverify=ON → set_default_verify_paths() + verify_peer
   SNI         → sslhost.empty() ? host : sslhost
   Hostname check → always runs when sslverify=ON (sslhost empty → host fallback)
   handshake() failure → error msg hints at CA / SSL_CERT_FILE / CN/SAN mismatch
   sock_type=2 (TLS established)

④ Re-send CLIENT_HANDSHAKE

⑤ Auth Switch loop (bounded ≤4 rounds)
   sock_type=2 (SSL) independent branch:
     - 0x03 fast auth success → wait for OK/ERR
     - 0x04 public key request → send plaintext password (TLS protects it, no RSA needed)

   sock_type=1 (non-SSL) path:
     - check_server_public_key() → EVP_PKEY_eq compare
     - mismatch → possible MITM → password NOT sent
     - empty    → trust server (weakness; forcing config recommended)</code></pre>

    <h3 id="mysql-auth-ssl-6">Quick Setup Checklist</h3>
    <pre><code># 0) Confirm server is running
./bin/test_mysql_handshake 1

# 1) Tier A: zero config default
./bin/test_mysql_handshake 50

# 2) Tier B hardening: grab server public key → copy to client → configure
sudo cp /usr/local/var/mysql/public_key.pem <project>/conf/public_key.pem
# Add to orm.conf:
# server_public_key=<project>/conf/public_key.pem

# 3) Tier C real security: enable TLS
# ssl=ON + sslverify=ON + sslhost=cert domain
# Install server CA into system trust store or set SSL_CERT_FILE=ca.pem</code></pre>

    document.getElementById('content-cn').innerHTML = cnFullContent;

    function buildHierarchyNav(lang) {
        const container = document.getElementById('dynamic-nav');
        const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
        if (!contentDiv) {
            container.innerHTML = '<p>Content not found</p>';
            return;
        }
        const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
        if (headings.length === 0) {
            container.innerHTML = '<p style="padding: 1rem;">No sections</p>';
            return;
        }

        const root = { children: [] };
        let stack = [root];

        headings.forEach(heading => {
            let level = parseInt(heading.tagName[1]);
            const id = heading.id;
            let title = heading.innerText.trim();
            if (!title) title = heading.textContent.trim() || "Section";
            const node = { level, id, title, children: [] };
            while (stack.length > 0 && stack[stack.length-1].level >= level) {
                stack.pop();
            }
            const parent = stack[stack.length-1];
            parent.children.push(node);
            stack.push(node);
        });

        function renderTree(nodes) {
            if (!nodes.length) return '';
            let html = '<ul class="nav-tree no-bullet">';
            nodes.forEach(node => {
                const hasChildren = node.children.length > 0;
                const liClass = `level-${node.level}`;
                html += `<li class="${liClass}">`;
                html += `<div class="tree-item"><a href="#${node.id}" data-id="${node.id}" class="nav-link">${escapeHtml(node.title)}</a></div>`;
                if (hasChildren) {
                    html += renderTree(node.children);
                }
                html += `</li>`;
            });
            html += '</ul>';
            return html;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const navHtml = renderTree(root.children);
        container.innerHTML = navHtml || '<p>No navigation</p>';

        attachNavEvents(contentDiv);
    }

    function attachNavEvents(contentDiv) {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.removeEventListener('click', navClickHandler);
            link.addEventListener('click', navClickHandler);
        });
        function navClickHandler(e) {
            e.preventDefault();
            const targetId = this.getAttribute('data-id');
            const targetElem = contentDiv.querySelector(`#${targetId}`);
            if (targetElem) {
                targetElem.scrollIntoView({ behavior: 'smooth', block: 'start' });

            }
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            this.classList.add('active-link');
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    if (id) {
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.remove('active-link');
                            if (link.getAttribute('data-id') === id) {
                                link.classList.add('active-link');
                            }
                        });
                    }
                }
            });
        }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });

        const allHeadings = contentDiv.querySelectorAll('[id]');
        allHeadings.forEach(el => observer.observe(el));

        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
        if (lang === 'cn') {
            document.getElementById('content-cn').classList.add('active-lang');
        } else {
            document.getElementById('content-en').classList.add('active-lang');
        }
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        buildHierarchyNav(lang);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const lang = btn.getAttribute('data-lang');
            if (lang) switchLanguage(lang);
        });
    });

    const menuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-open');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
    }

    const topBtn = document.getElementById('scrollTopBtn');
    topBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // URL hash 检测语言切换
    const hashLang = window.location.hash;
    if (hashLang === '#english' || hashLang === '#en') {
        switchLanguage('en');
    } else if (hashLang === '#chinese' || hashLang === '#zh') {
        switchLanguage('cn');
    } else {
        buildHierarchyNav('cn');
    }
</script>
</body>
</html>
