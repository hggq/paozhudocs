    <h2 id="intro">概述</h2>

    <h2 id="mask">路由掩码：分流开关</h2>
    <p>每条注册条目可以带一个 <code>unsigned int</code> 掩码，它决定两件事：</p>
    <ol>
        <li><strong>分流</strong>：<code>mask_code != 0</code> 表示这条路由归 RBAC 管，路由在调用该条目的 pre 之前先走判定钩子；<code>mask_code == 0</code> 表示完全不参与 RBAC —— 钩子一次都不调，零额外查询。</li>
        <li><strong>搬运</strong>：路由把它写进请求 <code>client.mask_code</code>，位置也在 pre 之前，所以 pre 与 handler 读到的是同一个值。</li>
    </ol>
    <p>这个值<strong>不是随便填的</strong>：它必须与登记该 urlpath 的 <code>sysperms.maskcode</code> 精确相等，否则该路由的每个请求都会被拒。</p>

    <pre><code>//@urlpath(null,maskpre/check)
std::string test_mask_pre(std::shared_ptr&lt;httppeer&gt; peer)
{
    httppeer &amp;client = peer-&gt;get_peer();
    client &lt;&lt; "pre 读到 mask_code=" &lt;&lt; client.mask_code;
    if (client.mask_code == 0) return "@exit";
    return "@ok";
}

//@urlpath(test_mask_pre,maskpre):ratelimit(20,5)                  // 掩码 0 → RBAC 不参与
//@urlpath(test_mask_pre,maskprehas):maskcode(1234)                 // 归 RBAC 管

    <h3 id="mask-syntax">注解写法与解析</h3>

        <tr><td>没有冒号 <code>//@urlpath(null,foo)</code></td><td><code>0</code></td></tr>
        <tr><td><code>:maskcode(1234)</code></td><td><code>1234</code></td></tr>
        <tr><td><code>:maskcode(1234):ratelimit(20,5)</code></td><td><code>1234</code>，另外 <code>rate_time=20</code>、<code>rate_num=5</code></td></tr>

        <tr><td><code>:maskcode()</code> / <code>:maskcode</code></td><td><code>0</code>，不告警</td></tr>
        <tr><td><code>:maskcode(99999999999)</code>（超过 UINT_MAX）</td><td>钳到 <code>UINT_MAX</code></td></tr>
        <tr><td><code>:maskcode(12abc)</code> / <code>:unknown(...)</code></td><td><code>0</code> 或忽略，并打印 <code>[ROUTE-WARN]</code></td></tr>
    </table>

    <div class="tip-box">💡 掩码是代码生成缓存键的一部分（和 pre 名、函数名、urlpath、返回类型、title 一起）。只改冒号后面的数字，下次构建就会重建 <code>controller/include/&lt;name&gt;.h</code> 和注册表。</div>

    <h2 id="guard">判定钩子与授权快照</h2>
    <p>框架只声明契约，不认识会话、角色和数据库：</p>
    <pre><code>using route_auth_fn = std::function&lt;unsigned int(httppeer &amp;,
        const std::string &amp;urlpath, unsigned int mask_code)&gt;;
// 配套：set_route_auth_hook() / route_auth_hook_ready()</code></pre>
    <p>实现在 <code>libs/rbac/route_guard.*</code>，返回值就是要写的状态码；路由层从不读会话键。<strong>两种拒绝要分开</strong>：会话没有 <code>adminid</code>（没登录）回 <code>401</code>；有 <code>adminid</code> 但租户 id（<code>session["userid"]</code>，登录时写的是 <code>sysuser.companyid</code>）为 <code>0</code> 回 <code>403</code>。<code>0</code> 不是可复用的全局层，这种账号应找管理员挂到企业上。<code>route_cache::allow()</code> 对同样的入参先拒，既不累加 miss，也不跑那 6 条装载查询。</p>

    </table>
    <p>Effective permission rows end up in <code>sysperms</code> (<code>urlpath</code> / <code>maskcode</code> / <code>name</code>). Grant chain: platform allocation → company role grants (narrowed by intersection) → user-role binding → login session → urlpath hit + exact maskcode match.</p>
    <div class="tip-box">💡 <code>keep_allocated</code> intersects role grants with <code>syscompanyperms</code>, so a platform-level revocation takes effect immediately; every grant row requires <code>owner == companyid &amp;&amp; companyid != 0</code>, refusing to treat 0 as a global tier.</div>

    <h2 id="decisions-en">Key Design Decisions</h2>
    <ol>
        <li><strong>Decision = urlpath hit + exact maskcode match</strong>: no bit containment; widening a catalog row is treated as no permission, preventing catalog/code drift.</li>
        <li><strong>Allocation-tier narrowing</strong>: <code>keep_allocated</code> intersects role grants with <code>syscompanyperms</code>, so a platform revocation takes effect immediately.</li>
        <li><strong>Hard tenant isolation</strong>: every grant row requires <code>owner == companyid &amp;&amp; companyid != 0</code>; <code>adminid == 0</code> gives 401 and <code>companyid == 0</code> gives 403.</li>
        <li><strong>Fail-closed end to end</strong>: DB errors, disabled accounts and cache load failures are all refused — nothing is cached and no old value is reused.</li>
        <li><strong>Validate before deleting on write paths</strong>: <code>replace_role_perms</code> validates the full allocatable set before removing old grants.</li>
    </ol>

    <h2 id="limits-en">Boundaries and Trade-offs</h2>
    <table>
        <tr><th>Aspect</th><th>Current state</th></tr>
        <tr><td>Expressiveness</td><td>Flat RBAC: no role inheritance, no mutual-exclusion constraints, no ABAC or resource-level permissions. Rules such as "may only edit own orders" belong in business code</td></tr>
        <tr><td>Consistency</td><td>In-process cache; multi-instance deployments rely on the 60s TTL fallback, so permission changes have a stale window of up to 60s</td></tr>
        <tr><td>Engineering details</td><td>Legacy <code>sysuser.roleid</code> dual track, grant replacement without a transaction, and the <code>operid</code> audit parameter not yet persisted</td></tr>
    </table>

<h2 id="pitfalls-en">Pitfalls and best practices</h2>
    <ul>
        <li><strong>One mask value per site, per urlpath group</strong>: after generating the table, <code>bin/paozhu_pre</code> groups non-zero-mask routes by <code>(site, mask_code)</code> and prints <code>[ROUTE-WARN] mask_code ... duplicated</code> when two routes share one value. It is a warning, not an error — RBAC still judges each urlpath separately — but distinct digits per route are simpler.</li>
        <li><strong>Mask drift</strong>: an annotation mask that differs from every catalog value the user holds means 403; fix it from <code>/superadmin/registerfunc</code>.</li>
        <li><strong>Hand-written registrations default to 0</strong>: <code>reg_raw()</code> and the <code>REG_*</code> macros pass neither a mask nor a title; write <code>:maskcode(...)</code> explicitly for protected routes.</li>
        <li><strong>No <code>)</code> inside a title</strong>: it silently swallows later suffixes and drops the mask to 0.</li>
        <li><strong>Removing the demo removes the hook too</strong>: emptying <code>libs/rbac/</code> also strips the <code>paozhu-rbac</code> blocks in <code>startup/</code>. The framework keeps no RBAC dependency, so every non-zero-mask route then answers 403.</li>
        <li><strong>Configuration-level pre filters are not routes</strong>: do not expect a mask or an RBAC decision there.</li>
    </ul>

    <h2 id="demo-en">Live demo</h2>
    <p><code>controller/src/test_maskcode.cpp</code> registers three routes: <code>/maskpre</code> has no maskcode, so RBAC never touches it and the pre prints <code>0</code> and stops; <code>/maskprehas</code> carries <code>1234</code>; <code>/comaskprehas</code> carries <code>1235</code> (the coroutine variant, same pre, same rule). <code>/testcohandle</code> carries no maskcode any more — it only demos coroutine dispatch.</p>
    <ol>
        <li>Prepare one <code>sysperms</code> row per urlpath whose <code>maskcode</code> equals the route value exactly (1234 and 1235 differ by one digit; one catalog row can feed only one route).</li>
        <li>Grant those rows to a role, then bind that role to the logged-in user.</li>
        <li>After login, the pre prints the mask and the handler prints it again; add <code>:maskcode(1234)</code> to <code>/maskpre</code> and the same request first goes through RBAC.</li>
    </ol>

    </ul>

    function buildHierarchyNav(lang) {
        const container = document.getElementById('dynamic-nav');
        const contentDiv = lang === 'cn' ? document.getElementById('content-cn') : document.getElementById('content-en');
        if (!contentDiv) { container.innerHTML = '<p>Content not found</p>'; return; }
        const headings = contentDiv.querySelectorAll('h2[id], h3[id], h4[id]');
        if (headings.length === 0) { container.innerHTML = '<p style="padding: 1rem;">No sections</p>'; return; }

        const root = { children: [] };
        let stack = [root];
        headings.forEach(heading => {
            let level = parseInt(heading.tagName[1]);
            const id = heading.id;
            let title = heading.innerText.trim();
            if (!title) title = heading.textContent.trim() || "Section";
            const node = { level, id, title, children: [] };
            while (stack.length > 0 && stack[stack.length-1].level >= level) { stack.pop(); }
            const parent = stack[stack.length-1];
            parent.children.push(node);
            stack.push(node);
        });

        function renderTree(nodes) {
            let html = '<ul class="nav-tree">';
            nodes.forEach(node => {
                const levelClass = 'level-' + (node.level - 1);
                html += `<li class="${levelClass}"><a href="#${node.id}" class="nav-link" data-id="${node.id}">${node.title}</a>`;
                if (node.children.length > 0) { html += renderTree(node.children); }
                html += '</li>';
            });
            html += '</ul>';
            return html;
        }
        container.innerHTML = renderTree(root.children);
        container.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const id = link.getAttribute('data-id');
                const target = document.getElementById(id);
                if (target) {
                    window.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
                    history.replaceState(null, null, '#' + id);
                }
            });
        });
    }

    function injectContent() {
        document.getElementById('content-cn').innerHTML = cnFullContent;
        document.getElementById('content-en').innerHTML = enFullContent;
    }
    injectContent();

    // Active heading tracking
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.id;
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active-link');
                    if (link.getAttribute('data-id') === id) { link.classList.add('active-link'); }
                });
            }
        });
    }, { rootMargin: "-80px 0px -70% 0px", threshold: 0.2 });

    const allHeadings = document.querySelectorAll('.content-panel [id]');
    allHeadings.forEach(el => observer.observe(el));

    let currentLang = 'en';
    function switchLanguage(lang) {
    try { localStorage.setItem('paozhu-lang', lang === 'cn' ? 'zh' : 'en'); } catch (e) {}
        currentLang = lang;
        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active-lang'));
        if (lang === 'cn') document.getElementById('content-cn').classList.add('active-lang');
        else document.getElementById('content-en').classList.add('active-lang');
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        buildHierarchyNav(lang);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const lang = btn.getAttribute('data-lang');
            if (lang) switchLanguage(lang);
        });
    });

    const menuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => sidebar.classList.toggle('mobile-open'));
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 860 && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('mobile-open');
            }
        });
    }

    const topBtn = document.getElementById('scrollTopBtn');
    topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) topBtn.classList.add('visible');
        else topBtn.classList.remove('visible');
    });

    const hashLang = window.location.hash;
    if (hashLang === '#english' || hashLang === '#en') switchLanguage('en');
    else if (hashLang === '#chinese' || hashLang === '#zh') switchLanguage('cn');
    else {
        const paozhuSavedLang = (() => { try { return localStorage.getItem('paozhu-lang'); } catch (e) { return null; } })();
        if (paozhuSavedLang === 'zh') switchLanguage('cn');
        else buildHierarchyNav('en');
    }
</script>
